<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4E9EE">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Körkortsresan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: a coach stage (big speed-limit disc behind the coach) beside a single play column; on phones the coach shrinks to a strip above the question.
   Palette: Swedish road-sign yellow/red/blue on cool asphalt-tinted neutrals. Type: Bricolage display, Figtree body, Barlow Condensed for sign numerals. */
:root{
  --bg:#E4E9EE; --bg-2:#D8DFE5; --surface:#FFFFFF; --surface-2:#F1F4F7;
  --ink:#191D22; --ink-2:#55606C; --ink-3:#8692A0; --line:#D0D8DF; --press:#BCC6CF;
  --sign-y:#FFC81E; --sign-y-deep:#C99504; --sign-r:#E1251B; --sign-b:#0A5CAD;
  --ok:#17905A; --ok-soft:#DCF2E6; --bad:#D2281F; --bad-soft:#FBE2E0;
  --road:#3B4149; --road-line:#F2F4F6;
  --grass:#CBE0BF; --scene-road:#727A83; --scene-line:#FFFFFF; --scene-label:#191D22;
  --veil:rgba(17,20,24,.55); --glow:rgba(255,255,255,.85); --track:#CFD8E0; --tile:#FFFFFF; --map-bg:#D6E7CB; --map-edge:#C2D6B5; --map-todo:#B9C4AE;
  --shadow:0 1px 0 rgba(20,30,40,.04), 0 10px 30px -14px rgba(20,30,40,.28);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-sign:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --bg-2:#161A1F; --surface:#1B2026; --surface-2:#232930;
    --ink:#ECEFF2; --ink-2:#A2ADB9; --ink-3:#6F7B87; --line:#2D343C; --press:#090B0D;
    --sign-r:#F0453B; --sign-b:#3C8BE0;
    --ok:#3BCB80; --ok-soft:#14321F; --bad:#FF6259; --bad-soft:#3A1B19;
    --road:#2A3037; --road-line:#E8ECEF;
    --grass:#22301F; --scene-road:#4A525B; --scene-line:#DADFE3; --scene-label:#ECEFF2;
    --veil:rgba(0,0,0,.65); --glow:rgba(255,200,30,.06); --track:#2A3037; --tile:#1B2026; --map-bg:#18241A; --map-edge:#22321F; --map-todo:#3A4A3A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --bg-2:#161A1F; --surface:#1B2026; --surface-2:#232930;
  --ink:#ECEFF2; --ink-2:#A2ADB9; --ink-3:#6F7B87; --line:#2D343C; --press:#090B0D;
  --sign-r:#F0453B; --sign-b:#3C8BE0;
  --ok:#3BCB80; --ok-soft:#14321F; --bad:#FF6259; --bad-soft:#3A1B19;
  --road:#2A3037; --road-line:#E8ECEF;
  --grass:#22301F; --scene-road:#4A525B; --scene-line:#DADFE3; --scene-label:#ECEFF2;
  --veil:rgba(0,0,0,.65); --glow:rgba(255,200,30,.06); --track:#2A3037; --tile:#1B2026; --map-bg:#18241A; --map-edge:#22321F; --map-todo:#3A4A3A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(900px 420px at 50% -160px,var(--glow),transparent 72%) no-repeat,var(--bg);color:var(--ink);font:500 16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.coach:focus-visible{outline:3px solid var(--sign-b);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
.num{font-family:var(--f-sign);font-variant-numeric:tabular-nums}

#app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;max-width:1120px;margin:0 auto}

/* ---------- buttons ---------- */
.btn{appearance:none;border:none;cursor:pointer;border-radius:14px;padding:14px 22px;font:800 1.05rem/1 var(--f-display);letter-spacing:.01em;background:var(--sign-y);color:#191D22;box-shadow:0 5px 0 var(--sign-y-deep);transition:transform .08s ease,box-shadow .08s ease,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sign-y-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);outline:2px solid var(--line);outline-offset:-2px}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.block{width:100%}
.icon-btn{appearance:none;border:none;background:var(--surface);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line);flex:none;transition:transform .08s}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.icon-btn svg{width:22px;height:22px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:800 1.25rem/1 var(--f-display);letter-spacing:-.01em}
.brand svg{width:34px;height:34px;flex:none}

/* ---------- coach peek ---------- */
.peek{position:fixed;z-index:65;pointer-events:none;--hw:clamp(96px,11vw,124px);width:0;height:0}
.peek[data-side="br"]{right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:0}
.peek[data-side="bl"]{left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:0}
.peek[data-side="r"]{right:0;top:44%}
.peek[data-side="l"]{left:0;top:44%}
.peek-head{position:absolute;width:var(--hw);pointer-events:auto;cursor:pointer;transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .2s;opacity:0}
.peek-head img{display:block;width:100%;height:auto;max-width:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));transform-origin:50% 88%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.peek.on .peek-head{opacity:1}
.peek.on .peek-head img{animation:sway 3s ease-in-out infinite}
.peek[data-side="br"] .peek-head{right:0;bottom:0;transform:translateY(110%)}
.peek[data-side="br"].on .peek-head{transform:translateY(14%) rotate(-5deg)}
.peek[data-side="bl"] .peek-head{left:0;bottom:0;transform:translateY(110%)}
.peek[data-side="bl"].on .peek-head{transform:translateY(14%) rotate(5deg)}
.peek[data-side="r"] .peek-head{right:0;top:0;transform:translateX(115%) rotate(-90deg)}
.peek[data-side="r"].on .peek-head{transform:translateX(18%) rotate(-78deg)}
.peek[data-side="l"] .peek-head{left:0;top:0;transform:translateX(-115%) rotate(90deg)}
.peek[data-side="l"].on .peek-head{transform:translateX(-18%) rotate(78deg)}
.peek-head.m-happy img{animation:nod .7s ease}
.peek-head.m-party img{animation:wiggle 1.1s ease}
.peek-head.m-sad img{animation:no .9s ease}
.peek-head.m-think img{animation:think 1.6s ease}
.peek-head.m-talk img{animation:talk .9s ease}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes nod{0%{transform:rotate(0)}30%{transform:rotate(-9deg) translateY(4%)}60%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.06)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg) scale(1.04)}80%{transform:rotate(5deg)}}
@keyframes no{0%,100%{transform:rotate(0)}15%{transform:rotate(8deg)}35%{transform:rotate(-7deg)}55%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes think{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-10deg)}}
@keyframes talk{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) translateY(-2%)}50%{transform:rotate(2.5deg)}75%{transform:rotate(-1.5deg)}}
.peek-bubble{position:absolute;width:max-content;max-width:min(290px,calc(100vw - 40px));background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:10px 14px 11px;box-shadow:0 4px 0 var(--ink);font:600 .98rem/1.4 var(--f-body);opacity:0;transform:scale(.5);transition:opacity .15s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;cursor:pointer}
.peek.on .peek-bubble{opacity:1;transform:scale(1);pointer-events:auto;transition-delay:.28s}
.peek-bubble .who{display:block;font:800 .68rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.peek-bubble .caret{display:inline-block;width:.5ch;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.peek-bubble::after{content:"";position:absolute;width:16px;height:16px;background:var(--surface);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.peek[data-side="br"] .peek-bubble{right:calc(var(--hw)*.62);bottom:calc(var(--hw)*.98);transform-origin:100% 100%}
.peek[data-side="br"] .peek-bubble::after{right:14px;bottom:-9px;transform:rotate(45deg)}
.peek[data-side="bl"] .peek-bubble{left:calc(var(--hw)*.62);bottom:calc(var(--hw)*.98);transform-origin:0 100%}
.peek[data-side="bl"] .peek-bubble::after{left:14px;bottom:-9px;transform:rotate(45deg)}
.peek[data-side="r"] .peek-bubble{right:calc(var(--hw)*.98);top:-6px;transform-origin:100% 20%}
.peek[data-side="r"] .peek-bubble::after{right:-9px;top:18px;transform:rotate(-45deg)}
.peek[data-side="l"] .peek-bubble{left:calc(var(--hw)*.98);top:-6px;transform-origin:0 20%}
.peek[data-side="l"] .peek-bubble::after{left:-9px;top:18px;transform:rotate(135deg)}
.heart{position:fixed;z-index:66;width:22px;height:22px;pointer-events:none;animation:floatup 1.7s ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{transform:translate(calc(-50% + var(--dx,0px)),-150px) scale(.8);opacity:0}}

/* ---------- home ---------- */
.home{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:6px 4px}
.hero-text{min-width:0}
.eyebrow{font:800 .74rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.hero h1{font-size:clamp(2.4rem,6vw,3.4rem);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal}
.hero-text > p:last-child{color:var(--ink-2);margin-top:8px}
.goal{position:relative;flex:none;width:92px;height:92px}
.goal .ring{display:block}
.ring-fill{transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1)}
.goal-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.goal-in b{font-size:1.7rem;font-weight:800}
.goal-in b small{font-size:.9rem;color:var(--ink-3);font-weight:700}
.goal-in span{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}

.level-card{background:linear-gradient(160deg,#454C55,#2F343B);color:#fff;border-radius:22px;padding:16px 18px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;box-shadow:var(--shadow)}
.lvl-sign{width:58px;height:58px}
.lvl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lvl-name{font:800 1.2rem/1.1 var(--f-display)}
.lvl-sub{font-size:.84rem;color:rgba(255,255,255,.68);margin-top:3px}
.daystreak{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:99px;padding:5px 10px 5px 7px;font-size:.78rem;color:rgba(255,255,255,.75);font-weight:700;flex:none}
.daystreak svg{width:18px;height:18px}
.daystreak b{font-size:1.1rem;color:#fff}
.xproad{position:relative;height:14px;margin-top:14px;background:#22262B;border-radius:99px;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.xproad::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 8px,transparent 8px 16px)}
.xproad i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sign-y);border-radius:99px;transition:width 1.1s cubic-bezier(.3,.8,.3,1)}
.xpcar{position:absolute;top:50%;left:0;width:36px;height:21px;transform:translate(-30%,-62%);transition:left 1.1s cubic-bezier(.3,.8,.3,1)}
.xpcar svg{display:block;width:100%;height:100%}

.start{appearance:none;border:none;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--sign-y);color:#191D22;border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 var(--sign-y-deep);transition:transform .1s ease,box-shadow .1s ease;touch-action:manipulation}
.start:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--sign-y-deep)}
.start:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sign-y-deep)}
.start-sign svg{width:54px;height:54px;display:block}
.start-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.start-text b{font:800 1.35rem/1.1 var(--f-display)}
.start-text small{font-size:.9rem;color:rgba(25,29,34,.7);font-weight:600}
.start-go{flex:none;width:46px;height:46px;border-radius:50%;background:#191D22;color:var(--sign-y);display:grid;place-items:center;transition:transform .2s}
.start:hover .start-go{transform:translateX(3px)}
.start-go svg{width:22px;height:22px}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.section-h h2{font-size:1.15rem;font-weight:800}
.section-h span{color:var(--ink-3);font-size:.84rem;font-weight:600}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{appearance:none;text-align:left;cursor:pointer;background:var(--tile);border:none;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--line);transition:transform .1s ease,box-shadow .1s ease;touch-action:manipulation}
.mode:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.mode:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode svg.sg{width:44px;height:44px}
.mode h3{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:6px}
.mode p{font-size:.84rem;color:var(--ink-2);margin-top:2px;line-height:1.35}
.mode[disabled]{opacity:.55;cursor:default}
.mode .tag{font:800 .72rem/1 var(--f-body);background:var(--sign-r);color:#fff;border-radius:99px;padding:4px 7px}

.cat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cat-tile{appearance:none;border:none;cursor:pointer;background:var(--tile);border-radius:18px;padding:14px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"icon pct" "name name" "bar bar";gap:8px;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .1s ease,box-shadow .1s ease;touch-action:manipulation}
.cat-tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.cat-tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cat-tile svg{grid-area:icon;width:38px;height:38px}
.ct-name{grid-area:name;font-weight:700;font-size:.86rem;line-height:1.25;min-height:2.5em}
.ct-pct{grid-area:pct;font-size:1.15rem;font-weight:800;color:var(--ink-2)}
.cat-tile .meter{grid-area:bar;display:block;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.cat-tile .meter i{display:block;height:100%;background:var(--ok);border-radius:99px}

.badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--tile);border-radius:16px;padding:12px 4px 10px}
.badge svg{width:44px;height:44px}
.badge b{font-size:.72rem;line-height:1.2}
.badge.locked svg{opacity:.3;filter:grayscale(1)}
.badge.locked b{color:var(--ink-3);font-weight:600}
.foot{font-size:.78rem;color:var(--ink-3);max-width:70ch;line-height:1.5;margin-top:6px}
.foot button{background:none;border:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}

/* ---------- quiz ---------- */
.hud{display:flex;align-items:center;gap:12px;padding-block:4px 14px;max-width:760px;margin:0 auto}
.road{position:relative;flex:1;min-width:0;height:34px;background:var(--road);border-radius:99px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.road::before{content:"";position:absolute;left:16px;right:30px;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--road-line) 0 12px,transparent 12px 22px);opacity:.55;border-radius:2px}
.road .dots{position:absolute;left:16px;right:30px;top:0;bottom:0}
.road .dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:dotin .35s cubic-bezier(.3,1.8,.5,1) forwards;border:2px solid var(--road)}
.road .dot.ok{background:var(--ok)}
.road .dot.bad{background:var(--bad)}
.road .dot.neutral{background:var(--sign-b)}
@keyframes dotin{to{transform:translate(-50%,-50%) scale(1)}}
.road .car{position:absolute;top:50%;left:16px;width:42px;height:24px;transform:translate(-50%,-56%);transition:left .7s cubic-bezier(.45,.05,.25,1);z-index:2}
.road .car.vroom svg{animation:vroom .7s ease}
@keyframes vroom{0%{transform:rotate(0)}20%{transform:rotate(-6deg) translateX(-2px)}60%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.road .flag{position:absolute;right:6px;top:50%;width:20px;height:24px;transform:translateY(-60%)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:12px;padding:0 12px;height:44px;box-shadow:0 3px 0 var(--line);flex:none}
.pill .num{font-size:1.5rem;font-weight:800;line-height:1}
.pill svg{width:20px;height:20px}
.pill.streak .mult{font:800 .78rem/1 var(--f-body);background:var(--sign-r);color:#fff;border-radius:7px;padding:4px 6px;display:none}
.pill.streak.hot .mult{display:inline-block}
.pill.streak.hot svg{animation:flame .6s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
.pill.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pill.timer.low{background:var(--bad-soft);color:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.timebar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin:-4px auto 14px;max-width:760px}
.timebar i{display:block;height:100%;background:var(--sign-y);border-radius:99px;transition:width .25s linear,background .3s}
.timebar.low i{background:var(--bad)}

.quiz{max-width:760px;margin:0 auto;padding-bottom:40px}
.card{background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0}
.q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);padding:7px 10px;border-radius:99px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--sign-b))}
.q-count{font:700 .95rem/1 var(--f-sign);color:var(--ink-3);letter-spacing:.04em}
.q-text{font:700 clamp(1.18rem,2.2vw,1.42rem)/1.32 var(--f-display);letter-spacing:-.005em;text-wrap:pretty}
.q-fig{display:flex;justify-content:center;margin:16px 0 4px}
.q-fig svg.sg{width:min(150px,40vw);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.q-fig svg.scene{width:100%;max-width:440px;height:auto;border-radius:16px}
.answers{display:grid;gap:12px;margin-top:18px}
.ans{appearance:none;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font:600 1rem/1.35 var(--f-body);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .08s ease,box-shadow .08s ease,border-color .15s,background .15s,opacity .3s;touch-action:manipulation;position:relative}
.ans:hover:not([disabled]){border-color:var(--ink-3)}
.ans:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.ans .key{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font:800 1.05rem/1 var(--f-sign);color:var(--ink-2);transition:background .15s,color .15s}
.ans .mark{margin-left:auto;flex:none;width:26px;height:26px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s cubic-bezier(.3,1.8,.5,1)}
.ans[disabled]{cursor:default}
.ans.correct{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);animation:popin .45s cubic-bezier(.3,1.7,.5,1)}
.ans.correct .key{background:var(--ok);color:#fff}
.ans.correct .mark,.ans.wrong .mark{opacity:1;transform:scale(1)}
.ans.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .45s ease}
.ans.wrong .key{background:var(--bad);color:#fff}
.ans.dim{opacity:.45}
.ans.picked{border-color:var(--sign-b);box-shadow:0 5px 0 var(--sign-b)}
.ans.picked .key{background:var(--sign-b);color:#fff}
.ans.gone{opacity:0;transform:scale(.94);pointer-events:none;transition:opacity .35s,transform .35s}
@keyframes popin{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.tool{appearance:none;border:2px dashed var(--line);background:transparent;border-radius:12px;padding:9px 12px;font:700 .88rem/1 var(--f-body);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tool:hover:not([disabled]){border-color:var(--ink-3);color:var(--ink)}
.tool[disabled]{opacity:.4;cursor:default}
.tool svg{width:18px;height:18px}
.kbd-hint{font-size:.78rem;color:var(--ink-3)}
.feedback{margin-top:18px;border-radius:18px;padding:16px 18px;background:var(--surface-2);display:grid;gap:12px;animation:slidein .35s cubic-bezier(.2,.9,.3,1)}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback h3{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px}
.feedback.ok h3{color:var(--ok)}
.feedback.bad h3{color:var(--bad)}
.feedback p{color:var(--ink);line-height:1.5}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.float-pts{position:fixed;z-index:60;pointer-events:none;font:800 1.7rem/1 var(--f-sign);color:var(--ok);text-shadow:0 2px 0 var(--surface),0 0 12px var(--surface);animation:ptsup 1.1s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.float-pts.neg{color:var(--bad)}
@keyframes ptsup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}

.combo{position:fixed;left:50%;top:38%;z-index:70;pointer-events:none;transform:translate(-50%,-50%);text-align:center}
.combo b{display:block;font:800 clamp(3rem,11vw,6.5rem)/0.9 var(--f-sign);color:var(--sign-y);-webkit-text-stroke:3px #191D22;paint-order:stroke fill;text-shadow:0 6px 0 #191D22;letter-spacing:.02em;font-style:italic}
.combo span{display:inline-block;margin-top:8px;font:800 1rem/1 var(--f-body);background:#191D22;color:#fff;padding:7px 12px;border-radius:99px;letter-spacing:.1em;text-transform:uppercase}
.combo{animation:combo 1.4s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-4deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9) rotate(-4deg)}}

/* ---------- results ---------- */
.results{max-width:760px;margin:0 auto}
.res-head{text-align:center;display:grid;gap:8px;justify-items:center}
.res-head h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.res-head p{color:var(--ink-2)}
.stars{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.stars svg{width:64px;height:64px;transform:scale(0);transition:none}
.stars svg.on{animation:starin .55s cubic-bezier(.3,1.8,.5,1) forwards}
.stars svg.off{animation:starin .4s ease forwards;opacity:.22}
.stars svg:nth-child(2){width:78px;height:78px;margin-top:-10px}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{background:var(--surface-2);border-radius:16px;padding:12px 10px;text-align:center}
.stat .num{font-size:1.9rem;font-weight:800;line-height:1}
.stat small{display:block;font-size:.74rem;color:var(--ink-2);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.res-xp{margin-top:16px;background:var(--road);color:#fff;border-radius:18px;padding:14px 16px}
.res-xp .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:.92rem}
.res-xp .row .num{font-size:1.25rem;color:var(--sign-y)}
.res-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.res-actions .btn{flex:1 1 180px}
.verdict{display:inline-block;font:800 .8rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:99px}
.verdict.pass{background:var(--ok);color:#fff}
.verdict.fail{background:var(--bad);color:#fff}
.review{margin-top:22px;display:grid;gap:12px}
.review h2{font-size:1.15rem;font-weight:800}
.rv{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.rv .q{font-weight:700}
.rv .you{color:var(--bad);font-size:.92rem}
.rv .right{color:var(--ok);font-size:.92rem;font-weight:700}
.rv .why{color:var(--ink-2);font-size:.9rem}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:var(--veil);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:24px;padding:22px;width:min(460px,100%);box-shadow:var(--shadow);animation:sheetin .4s cubic-bezier(.2,1.2,.3,1);max-height:calc(100vh - 48px);overflow:auto}
@keyframes sheetin{from{transform:translateY(20px) scale(.96);opacity:0}}
.sheet h2{font-size:1.4rem;font-weight:800}
.sheet p{color:var(--ink-2);margin-top:6px}
.sheet .row{display:flex;gap:10px;margin-top:18px}
.sheet .row .btn{flex:1}
.cat-pick{display:grid;gap:10px;margin-top:16px}
.cat-pick button{appearance:none;border:none;cursor:pointer;text-align:left;background:var(--surface-2);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.cat-pick button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cat-pick svg{width:42px;height:42px}
.cat-pick b{display:block;font-size:1rem}
.cat-pick small{color:var(--ink-2);font-size:.82rem}
.cat-pick .pct{font:800 1.2rem/1 var(--f-sign);color:var(--ink-2)}
.lvlup{text-align:center;display:grid;justify-items:center;gap:8px}
.lvlup .lvl-sign{width:120px;height:120px;animation:spinin .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}
.lvlup small{font:800 .8rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--sign-r)}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));z-index:90;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:toast 3.2s cubic-bezier(.2,1,.3,1) forwards;max-width:calc(100vw - 32px)}
.toast svg{width:42px;height:42px;flex:none}
.toast b{display:block;font-size:.95rem}
.toast small{font-size:.8rem;opacity:.75}
@keyframes toast{0%{transform:translate(-50%,-140%)}12%{transform:translate(-50%,0)}86%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-140%);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:75}

/* ---------- map, daily, intro ---------- */
.map-card{background:var(--map-bg);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.map-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 0}
.map-head .lvl-name{font:800 1.25rem/1.1 var(--f-display);color:var(--ink)}
.map-head .lvl-sub{font-size:.84rem;color:var(--ink-2);margin-top:4px}
.map-head .daystreak{background:var(--surface);color:var(--ink-2)}
.map-head .daystreak b{color:var(--ink)}
.map-scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.map-scroll::-webkit-scrollbar{display:none}
#map{display:block;width:100%;min-width:620px;height:auto}
.m-edge{stroke:var(--map-edge)}
.m-road{stroke:var(--road)}
.m-line{stroke:var(--road-line);opacity:.6}
.stn .dotc{stroke:#fff;stroke-width:3}
.stn.done .dotc{fill:var(--sign-b)}
.stn.now .dotc{fill:var(--sign-y)}
.stn.todo .dotc{fill:var(--map-todo)}
.stn-n{font:800 15px var(--f-sign);fill:#fff}
.stn.now .stn-n{fill:#191D22}
.stn.todo .stn-n{fill:var(--ink-3)}
.stn-l{font:700 12.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:5px;stroke-linejoin:round}

.stn-l.cur{font-size:14px;font-weight:800}
.stn .pulse{fill:var(--sign-y);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse2 1.6s ease-out infinite}

.daily{display:flex;align-items:center;gap:14px;background:var(--tile);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.daily-ic{flex:none;width:44px;height:44px;display:grid;place-items:center}
.daily-ic svg{width:44px;height:44px}
.daily.done .daily-ic svg{width:34px;height:34px}
.daily-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.daily-tx b{font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eyebrow-s{font:800 .7rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.btn.sm{padding:11px 16px;font-size:.95rem;box-shadow:0 4px 0 var(--sign-y-deep);flex:none}
.sheet.wide{width:min(600px,100%)}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip.retry{background:var(--sign-y);color:#191D22}
.xpbar{height:12px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--sign-y);border-radius:99px}

.intro{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 500px at 50% 0,var(--glow),transparent 70%),var(--bg);overflow:hidden;transition:opacity .45s ease}
.intro.out{opacity:0}
.intro-text{position:absolute;left:0;right:0;top:12%;text-align:center;padding:0 24px;animation:introText .8s .2s cubic-bezier(.2,.9,.3,1) both}
.intro-sign svg{width:64px;height:64px;animation:spinin 1s cubic-bezier(.3,1.5,.5,1) both}
.intro-text h1{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:800;letter-spacing:-.03em;margin-top:12px}
.intro-text p{color:var(--ink-2);font-size:1.08rem;margin-top:8px}
@keyframes introText{from{opacity:0;transform:translateY(16px)}}
.intro-road{position:absolute;left:0;right:0;top:58%;height:70px;background:var(--road)}
.intro-road::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--road-line) 0 26px,transparent 26px 48px);opacity:.7;animation:roadmove .5s linear 3}
@keyframes roadmove{to{background-position:-48px 0}}
.intro-car{position:absolute;left:50%;top:calc(58% - 76px);width:min(200px,52vw);aspect-ratio:48/28;transform:translateX(-50%);animation:driveIn 1.5s .3s cubic-bezier(.2,.85,.3,1.08) both}
.intro-car .intro-body{position:absolute;inset:0;width:100%;height:100%}
.intro-car .intro-head{position:absolute;left:29%;bottom:72%;width:42%;height:auto;max-width:none;animation:headbob 1.2s 1.8s ease-in-out infinite;transform-origin:50% 90%}
.intro-car.go{animation:driveOut 1.1s cubic-bezier(.6,0,.9,.6) forwards}
@keyframes driveIn{from{transform:translateX(calc(-50% - 100vw))}to{transform:translateX(-50%)}}
@keyframes driveOut{0%{transform:translateX(-50%)}15%{transform:translateX(calc(-50% - 14px)) rotate(-2deg)}100%{transform:translateX(calc(-50% + 100vw)) rotate(0)}}
@keyframes headbob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.intro-go{position:absolute;left:50%;top:calc(58% + 100px);transform:translateX(-50%);animation:introBtn .5s 1.6s cubic-bezier(.3,1.5,.5,1) both;white-space:nowrap}
.intro-go:active{transform:translateX(-50%) translateY(4px)}

@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}

}

}

{id:"r3",c:"regler",img:"scene:hoger",q:"Ni kommer fram samtidigt till en korsning utan vägmärken eller signaler. Vem ska du lämna företräde?",
 a:["Den röda bilen som kommer från höger","Den blå bilen som kommer från vänster","Ingen – den som kom först kör först","Båda bilarna"],
 e:"Högerregeln: i en korsning utan reglering ska du lämna företräde åt den som kommer från höger. Den blå bilen har dig på sin högra sida och ska därför vänta på dig."},
{id:"r4",c:"regler",q:"En gående är på väg ut på ett obevakat övergångsställe. Vad gäller för dig?",
 a:["Du ska sakta ner och lämna företräde","Bara om personen redan är ute på gatan","Du får köra om personen hinner stanna","Gående har väjningsplikt mot bilar"],
 e:"Du ska lämna företräde åt gående som är på eller på väg ut på ett obevakat övergångsställe. Anpassa farten i god tid."},
{id:"r5",c:"regler",q:"Hur nära före ett övergångsställe får du som närmast stanna eller parkera?",
 a:["10 meter","5 meter","15 meter","20 meter"],
 e:"Du får inte stanna eller parkera på ett övergångsställe eller inom 10 meter före det. Bilen skymmer annars sikten mot gående."},
{id:"r6",c:"regler",q:"Hur länge får du parkera på samma plats en vanlig vardag (inte dagen före en helgdag) om inget annat anges?",
 a:["24 timmar i följd","8 timmar i följd","12 timmar i följd","48 timmar i följd"],
 e:"Grundregeln är högst 24 timmar i följd på samma ställe på vardagar, utom vardag före sön- och helgdag. Lokala regler kan säga något annat."},
{id:"r7",c:"regler",q:"Du kör på en väg med högst 50 km/h. En buss blinkar för att köra ut från en hållplats framför dig. Vad gäller?",
 a:["Sänka farten och släppa ut bussen","Bussen har väjningsplikt mot dig","Bara om bussen är en skolbuss","Bara om bussen redan har börjat köra"],
 e:"På vägar med högst 50 km/h ska du ge bussen möjlighet att köra ut från hållplatsen när den visar körriktningsvisare."},
{id:"r8",c:"regler",q:"Ett utryckningsfordon med blåljus och siren närmar sig bakifrån. Vad gör du?",
 a:["Lämnar fri väg när det är säkert","Stannar direkt där du är","Ökar farten tills du kan köra åt sidan","Kör vidare tills du når en ficka"],
 e:"Du ska lämna fri väg åt utryckningsfordon. Gör det lugnt och förutsägbart, utan tvära inbromsningar."},
{id:"r9",c:"regler",img:"scene:rondell",q:"Hur ska du använda körriktningsvisaren i en cirkulationsplats?",
 a:["Höger blinkers innan du kör ut","Vänster blinkers när du kör in","Ingen blinkers om du kör rakt fram","Höger blinkers när du kör in"],
 e:"Visa med höger blinkers när du ska lämna cirkulationsplatsen, så att andra förstår vad du tänker göra."},
{id:"r10",c:"regler",q:"Du ska korsa ett spårvägsspår i en korsning och en spårvagn närmar sig från vänster. Vem har företräde?",
 a:["Spårvagnen – du ska lämna den företräde","Du, eftersom spårvagnen kommer från vänster","Den som kommer först till korsningen","Du, om du redan har påbörjat svängen"],
 e:"Du ska lämna spårvagnar företräde i korsningar, även om de kommer från vänster. Undantaget är om spårvagnen har väjnings- eller stopplikt."},
{id:"r11",c:"regler",q:"Var är det förbjudet att köra om?",
 a:["Strax före obevakat övergångsställe","På en väg med heldragen kantlinje","I en kurva med god sikt","På en väg med två körfält i samma riktning"],
 e:"Det är förbjudet att köra om strax före och på obevakade övergångsställen, eftersom en gående kan vara skymd av fordonet du kör om."},
{id:"r12",c:"regler",img:"scene:hogerom",q:"När får du köra om ett fordon på höger sida?",
 a:["När den framför svänger vänster","När höger körfält är fritt på motorväg","När fordonet framför kör långsamt","Aldrig – omkörning sker alltid till vänster"],
 e:"Omkörning sker normalt till vänster, men om fordonet framför ska svänga vänster och har placerat sig för det, kör du förbi på höger sida."},
{id:"r13",c:"regler",img:"scene:hinder",q:"Det står en parkerad bil på din sida av vägen och en bil möter dig. Vägen är för smal för att ni ska kunna mötas vid bilen. Vem bör vänta?",
 a:["Du, eftersom hindret är på din sida","Den mötande bilen, den har fri väg","Den som kommer först till hindret","Den större bilen, den behöver mer plats"],
 e:"Den som har hindret på sin sida bör stanna och släppa förbi mötande trafik."},
{id:"r14",c:"regler",img:"scene:pafart",q:"Du kör ut på motorvägen via ett accelerationsfält. Vad gäller?",
 a:["Lämna företräde åt trafiken på motorvägen","Trafiken på motorvägen ska släppa in dig","Blixtlåsprincipen gäller","Stanna i slutet och vänta på lucka"],
 e:"Använd accelerationsfältet för att komma upp i samma fart som trafiken och hitta en lucka. Du ska lämna företräde åt trafiken som redan är på motorvägen."},
{id:"r15",c:"regler",q:"Två körfält går ihop till ett. Hur bör trafiken göra?",
 a:["Turas om, en bil från varje körfält","Det fortsättande körfältet har företräde","Bilarna i körfältet som slutar ska vänta","Den som kör fortast kör in först"],
 e:"Blixtlåsprincipen: fordonen från de båda körfälten turas om, en från varje håll. Det ger jämnast trafik och minst köer."},
{id:"r16",c:"regler",q:"När ska du blända av från helljus?",
 a:["När du möter andra trafikanter","Bara när du möter andra bilar","När du har kört i en kvart","Bara när någon blinkar åt dig"],
 e:"Blända av i god tid så att du inte bländar mötande, eller den du kör bakom via backspegeln."},
{id:"r17",c:"regler",q:"Får du hålla mobilen i handen och prata under körning?",
 a:["Nej, det är förbjudet","Ja, om du kör under 50 km/h","Ja, om samtalet är kort","Ja, om du står still i kö"],
 e:"Sedan 2018 är det förbjudet att använda mobiltelefon som hålls i handen under körning. Handsfree är tillåtet, men även det tar uppmärksamhet."},
{id:"r18",c:"regler",q:"Vad gäller i ett gångfartsområde?",
 a:["Du kör i gångfart och gående har företräde","Högst 30 km/h och bilar har företräde","Högst 20 km/h och gående har väjningsplikt","Gångfart, men bilar har företräde"],
 e:"I ett gångfartsområde kör du i gångfart och lämnar gående företräde. Du får bara parkera på markerade platser."},
{id:"r19",c:"regler",q:"En cyklist ska korsa vägen på en obevakad cykelöverfart. Vad gäller för dig som bilförare?",
 a:["Du ska lämna cyklisten företräde där","Cyklisten har väjningsplikt mot dig","Bara om cyklisten leder cykeln","Du har företräde om du kör i 50 km/h"],
 e:"Vid en obevakad cykelöverfart ska du lämna företräde åt cyklister som är på eller just ska köra ut på överfarten. Vid en cykelpassage är det tvärtom: där har cyklisten väjningsplikt."},
{id:"r20",c:"regler",q:"Du ska backa ut från en parkeringsplats. Vem har ansvaret?",
 a:["Du som backar","Den som kör förbi bakom dig","Ni delar på ansvaret lika","Den som kommer från höger"],
 e:"Den som backar ska se till att det kan ske utan fara eller hinder för andra. Ta hjälp av någon om sikten är dålig."},
{id:"r21",c:"regler",q:"Måste du ha lyset tänt när du kör på dagen?",
 a:["Ja, minst varselljus eller halvljus","Nej, bara i mörker och dåligt väder","Bara utanför tättbebyggt område","Bara under vinterhalvåret"],
 e:"Under färd ska du alltid ha halvljus eller varselljus tänt. I mörker och vid nedsatt sikt behövs halvljus, eftersom varselljus ofta inte tänder baklyktorna."},
{id:"r22",c:"regler",q:"När får du använda signalhornet?",
 a:["När det behövs för att varna för fara","När någon kör för långsamt framför dig","När du vill tacka någon som släppt fram dig","När du kör ut från en parkeringsplats"],
 e:"Ljudsignal får bara användas för att avvärja fara. Att tuta i onödan är inte tillåtet."},
{id:"r23",c:"regler",q:"Vem ansvarar för att en passagerare under 15 år använder bilbälte eller bilbarnstol?",
 a:["Föraren av bilen","Barnet självt från 12 års ålder","Barnets förälder, även om den inte kör","Den vuxne som sitter bredvid barnet"],
 e:"Föraren ansvarar för att passagerare under 15 år använder bälte eller annan lämplig skyddsanordning."},
{id:"r24",c:"regler",q:"Får ett barn som är kortare än 140 cm sitta framför en aktiverad krockkudde?",
 a:["Nej, aldrig","Ja, om barnet har bälte på sig","Ja, om stolen är skjuten långt bak","Ja, om barnet är över 7 år"],
 e:"Barn kortare än 140 cm får inte sitta på en plats framför en aktiverad krockkudde. Kudden kan skada barnet allvarligt."},

/* ---------- Säkerhet & människan ---------- */
{id:"h1",c:"sakerhet",q:"Var går gränsen för rattfylleri?",
 a:["0,2 promille","0,5 promille","0,1 promille","0,8 promille"],
 e:"Gränsen för rattfylleri är 0,2 promille. Den är låg med flit: redan små mängder påverkar reaktionsförmågan."},
{id:"h2",c:"sakerhet",q:"Vid vilken alkoholhalt räknas det som grovt rattfylleri?",
 a:["1,0 promille","0,5 promille","0,8 promille","1,5 promille"],
 e:"Vid minst 1,0 promille, eller om föraren är märkbart påverkad, räknas det som grovt rattfylleri. Det kan ge fängelse."},
{id:"h3",c:"sakerhet",q:"Vad hjälper för att bli nykter snabbare?",
 a:["Ingenting, bara tid","Kaffe och mat","Sova en timme","Dricka mycket vatten"],
 e:"Levern bryter ner alkoholen i sin egen takt. Kaffe och dusch kan få dig att känna dig piggare, men promillehalten sjunker inte snabbare."},
{id:"h4",c:"sakerhet",q:"Du känner dig väldigt trött när du kör. Vad är bäst att göra?",
 a:["Stanna och sova en stund","Öppna fönstret och höja musiken","Dricka kaffe och köra vidare","Köra långsammare de sista milen"],
 e:"Det enda som hjälper mot trötthet är sömn. En tupplur på 15–20 minuter kan göra stor skillnad. Fönster och musik hjälper bara en kort stund."},
{id:"h5",c:"sakerhet",q:"Om du dubblar hastigheten, hur förändras bromssträckan?",
 a:["Ungefär fyra gånger så lång","Ungefär dubbelt så lång","Ungefär tre gånger så lång","Ungefär sex gånger så lång"],
 e:"Bromssträckan ökar med hastigheten i kvadrat. Dubbla farten ger ungefär fyra gånger så lång bromssträcka."},
{id:"h6",c:"sakerhet",q:"Vad består stoppsträckan av?",
 a:["Reaktionssträckan plus bromssträckan","Reaktionssträckan minus bromssträckan","Bara bromssträckan","Bromssträckan plus avståndet till bilen framför"],
 e:"Stoppsträckan är den sträcka du kör medan du reagerar plus den sträcka det tar att bromsa till stillastående."},
{id:"h7",c:"sakerhet",q:"Hur långt hinner du ungefär köra under en sekund i 50 km/h?",
 a:["Cirka 14 meter","Cirka 5 meter","Cirka 25 meter","Cirka 50 meter"],
 e:"50 km/h är ungefär 14 meter per sekund. Med en reaktionstid på runt en sekund hinner du alltså köra 14 meter innan du ens börjar bromsa."},
{id:"h8",c:"sakerhet",q:"Vad händer med ditt synfält när hastigheten ökar?",
 a:["Det blir smalare, du ser mindre åt sidorna","Det blir bredare eftersom du är mer alert","Det påverkas inte av hastigheten","Det blir smalare, men bara i mörker"],
 e:"Vid hög fart fokuserar blicken längre fram och du uppfattar mindre i ytterkanterna, så kallat tunnelseende."},
{id:"h9",c:"sakerhet",q:"Bilen börjar vattenplana. Vad gör du?",
 a:["Släpper gasen, håller ratten still","Bromsar hårt med ABS-bromsen","Gasar lätt för att få grepp","Styr försiktigt mot vägkanten"],
 e:"Vid vattenplaning tappar däcken kontakten med vägen. Släpp gasen, håll ratten rakt och vänta tills greppet kommer tillbaka."},
{id:"h10",c:"sakerhet",q:"Vad är den största fördelen med ABS-bromsar?",
 a:["Du kan styra medan du bromsar hårt","Bromssträckan blir alltid kortare","Bilen kan inte få sladd","Du behöver inte trycka hårt på bromsen"],
 e:"ABS hindrar hjulen från att låsa sig, så du kan styra runt ett hinder medan du bromsar fullt. Bromssträckan blir inte alltid kortare, till exempel på grus eller lössnö."},
{id:"h11",c:"sakerhet",q:"Vilket tidsavstånd till bilen framför bör du minst hålla på torr väg?",
 a:["3 sekunder","1 sekund","2 sekunder","5 sekunder"],
 e:"Tresekundersregeln: välj en punkt som bilen framför passerar och räkna. Når du punkten före tre sekunder ligger du för nära. Håll ännu längre avstånd på hal väg."},
{id:"h12",c:"sakerhet",q:"Vilket nummer ringer du vid en trafikolycka med skadade?",
 a:["112","114 14","1177","911"],
 e:"112 är numret för akuta nödsituationer. 114 14 är polisens nummer för icke akuta ärenden och 1177 är sjukvårdsrådgivning."},
{id:"h13",c:"sakerhet",q:"Du kommer först fram till en trafikolycka. Vad är viktigast att göra först?",
 a:["Skaffa överblick och varna annan trafik först","Ringa 112 innan du gör något annat","Hjälpa de skadade ut ur bilarna","Ge första hjälpen till den som skriker mest"],
 e:"Skapa överblick och varna (varningsblinkers, varningstriangel, reflexväst). Larma sedan 112 och hjälp de skadade så gott du kan."},
{id:"h14",c:"sakerhet",q:"Varför ska du vrida på huvudet innan du byter körfält?",
 a:["För att se döda vinkeln","För att kontrollera trafiken framför dig","För att visa att du ska byta körfält","För att backspegeln inte visar bakåt"],
 e:"Speglarna visar inte allt. En snabb blick över axeln avslöjar fordon i döda vinkeln."},
{id:"h15",c:"sakerhet",q:"Du har kört på ett rådjur. Vad måste du göra?",
 a:["Markera platsen och ringa 112 till polisen","Bara ringa försäkringsbolaget","Markera platsen, men bara om djuret lever","Anmäla det inom en vecka"],
 e:"Krockar med bland annat älg, rådjur, hjort och vildsvin måste anmälas till polisen. Markera platsen så att en eftersöksjägare hittar dit."},
{id:"h16",c:"sakerhet",q:"Varför är gående svåra att upptäcka i mörker?",
 a:["De syns först på kort avstånd","Halvljuset lyser bara upp vägens mitt","De syns bara dåligt i stadstrafik","Ögonen anpassar sig inte till halvljus"],
 e:"En mörkt klädd gående kan synas först på 20–30 meters håll i halvljus. Med reflex syns personen mycket tidigare."},
{id:"h17",c:"sakerhet",q:"Du har tagit ett läkemedel som kan göra dig dåsig. Vad gäller?",
 a:["Du får inte köra om läkemedlet påverkar dig","Det är tillåtet om läkemedlet är förskrivet","Du får köra om du väntar en timme","Det gäller bara receptfria läkemedel"],
 e:"Även receptbelagda läkemedel kan göra dig olämplig att köra. Läs bipacksedeln och fråga läkare eller apotek om du är osäker."},

/* ---------- Miljö & sparsam körning ---------- */
{id:"m1",c:"miljo",q:"Vilket körsätt sparar mest bränsle?",
 a:["Jämn fart och tidig uppväxling","Hög fart på låg växel","Snabb acceleration och sedan friläge","Lugn acceleration och sen uppväxling"],
 e:"Sparsam körning handlar om att planera, rulla mjukt och hålla låga varvtal. Det sparar bränsle, sliter mindre och är säkrare."},
{id:"m2",c:"miljo",q:"När släpper en bensinbil ut mest skadliga avgaser?",
 a:["Strax efter en kallstart","När motorn är varm och går på tomgång","Vid hög fart på motorväg","Vid motorbromsning nedför"],
 e:"En kall katalysator renar dåligt. De första kilometrarna efter en kallstart står för en stor del av utsläppen, särskilt på vintern."},
{id:"m3",c:"miljo",q:"Varför är det bra att använda motorvärmare på vintern?",
 a:["Mindre utsläpp och slitage","Batteriet laddas medan bilen står","Bilen behöver inga vinterdäck då","Den förlänger däckens livslängd"],
 e:"En förvärmd motor når arbetstemperatur snabbare. Det minskar utsläppen och slitaget kraftigt vid kallstart."},
{id:"m4",c:"miljo",q:"Vad händer om lufttrycket i däcken är för lågt?",
 a:["Förbrukningen ökar och greppet blir sämre","Förbrukningen minskar, bilen rullar lättare","Greppet blir bättre i kurvor","Ingen märkbar skillnad"],
 e:"För lågt däcktryck ökar rullmotståndet och slitaget, och bilen blir mer svårkontrollerad. Kontrollera trycket regelbundet."},
{id:"m5",c:"miljo",q:"Hur påverkar en tom takbox bränsleförbrukningen?",
 a:["Den ökar på grund av luftmotståndet","Den påverkas inte när boxen är tom","Den minskar tack vare bättre aerodynamik","Den ökar bara när boxen är full"],
 e:"Takboxar och takräcken ökar luftmotståndet, särskilt i högre farter. Ta av dem när de inte används."},
{id:"m6",c:"miljo",q:"Vad händer när du motorbromsar, alltså släpper gasen med växeln i?",
 a:["Nästan inget bränsle går åt alls","Förbrukningen ökar eftersom varvtalet är högt","Lika mycket som på tomgång","Mer än vid jämn fart"],
 e:"När du rullar med växeln i och släpper gasen stänger moderna motorer ofta av bränsletillförseln. Planera för att rulla mot rödljus och korsningar."},
{id:"m7",c:"miljo",q:"Vilken gas från förbränning av fossila bränslen bidrar mest till växthuseffekten?",
 a:["Koldioxid","Kolmonoxid","Kväveoxider","Metan"],
 e:"Koldioxid från bensin och diesel är vägtrafikens största bidrag till klimatpåverkan."},
{id:"m8",c:"miljo",q:"Varför ska du undvika att låta motorn gå på tomgång?",
 a:["Onödiga utsläpp och buller","Det skadar motorn direkt","Det laddar inte batteriet","Det är förbjudet i hela Sverige"],
 e:"Tomgångskörning ger avgaser och buller utan att du kommer någonstans. Många kommuner begränsar tomgång till ungefär en minut."},
{id:"m9",c:"miljo",q:"Vilken miljöpåverkan har dubbdäck?",
 a:["De river upp skadliga partiklar","De minskar bullret i staden","De ökar koldioxidutsläppen mest","De förstör bara grusvägar"],
 e:"Dubbarna sliter på asfalten och skapar partiklar som är skadliga att andas in. Därför har vissa gator förbud mot dubbdäck."},
{id:"m10",c:"miljo",q:"Hur påverkar högre hastighet bränsleförbrukningen på landsväg?",
 a:["Den ökar, främst av luftmotståndet","Den minskar eftersom motorn går jämnare","Den påverkas inte förrän över 120 km/h","Den ökar bara i uppförsbackar"],
 e:"Luftmotståndet växer kraftigt med farten. Att sänka från 110 till 100 km/h sparar märkbart med bränsle."},
{id:"m11",c:"miljo",q:"Varför tjänar en elbil på mjuka inbromsningar?",
 a:["Elmotorn återvinner energi till batteriet","Bromsarna laddar batteriet när de blir varma","Motorn slits mindre","Däcken håller längre"],
 e:"Vid mjuk inbromsning fungerar elmotorn som generator och laddar batteriet. Hårda inbromsningar använder i stället de vanliga bromsarna, och den energin går förlorad som värme."},

/* ---------- Fordon & körkort ---------- */
{id:"f1",c:"fordon",q:"Vilket mönsterdjup måste sommardäck minst ha?",
 a:["1,6 mm","3 mm","1 mm","2 mm"],
 e:"Lagkravet för sommardäck är 1,6 mm, men greppet på våt väg blir tydligt sämre redan runt 3 mm."},
{id:"f2",c:"fordon",q:"Vilket mönsterdjup måste vinterdäck minst ha när kravet på vinterdäck gäller?",
 a:["3 mm","1,6 mm","4 mm","5 mm"],
 e:"Under vinterdäcksperioden (1 december–31 mars vid vinterväglag) måste vinterdäcken ha minst 3 mm mönsterdjup."},
{id:"f3",c:"fordon",q:"När måste en personbil ha vinterdäck?",
 a:["1 dec–31 mars vid vinterväglag","1 nov–31 mars, oavsett väglag","1 okt–15 april vid vinterväglag","15 nov–15 mars, oavsett väglag"],
 e:"Kravet gäller 1 december till 31 mars när det råder vinterväglag. Det är polisen som bedömer om det är vinterväglag."},
{id:"f4",c:"fordon",q:"När får du normalt använda dubbdäck?",
 a:["1 okt–15 april (eller vid vinterväglag)","1 nov–31 mars","1 dec–31 mars","1 okt–30 april"],
 e:"Dubbdäck är tillåtna 1 oktober–15 april. Utanför den perioden får de användas om det är, eller kan antas bli, vinterväglag."},
{id:"f5",c:"fordon",q:"När ska en ny personbil kontrollbesiktas första gången?",
 a:["Senast 3 år efter att den togs i trafik","Senast 2 år efter att den togs i trafik","Senast 1 år efter att den togs i trafik","Senast 5 år efter att den togs i trafik"],
 e:"Regeln kallas 3-2-1: första besiktningen inom 3 år, nästa inom 2 år och därefter varje år."},
{id:"f6",c:"fordon",q:"Vilken försäkring måste ett fordon i trafik ha enligt lag?",
 a:["Trafikförsäkring","Halvförsäkring","Helförsäkring","Vagnskadeförsäkring"],
 e:"Trafikförsäkringen är obligatorisk och ersätter personskador och skador på andras egendom. Halv- och helförsäkring är frivilliga."},
{id:"f7",c:"fordon",q:"Hur hög totalvikt får en personbil högst ha för att du ska få köra den med B-körkort?",
 a:["3 500 kg","3 000 kg","3 750 kg","4 250 kg"],
 e:"B-behörighet gäller bilar med en totalvikt på högst 3 500 kg."},
{id:"f8",c:"fordon",q:"Får du dra en släpvagn med B-körkort?",
 a:["Ja, men med viktgränser","Ja, utan viktgränser om släpet är bromsat","Nej, det kräver alltid BE-körkort","Ja, men bara släp under 500 kg"],
 e:"Med B får du dra ett lätt släp (högst 750 kg totalvikt), eller ett tyngre om bilens och släpets sammanlagda totalvikt är högst 3 500 kg."},
{id:"f9",c:"fordon",q:"Hur lång är provtiden för ett nytt körkort?",
 a:["2 år","1 år","3 år","18 månader"],
 e:"Provtiden är två år. Återkallas körkortet under provtiden måste du göra om både kunskapsprov och körprov."},
{id:"f10",c:"fordon",q:"Hur gammal måste en handledare vid privat övningskörning minst vara?",
 a:["24 år","21 år","25 år","20 år"],
 e:"Handledaren ska ha fyllt 24 år och haft körkort för behörigheten i minst fem av de senaste tio åren."},
{id:"f11",c:"fordon",q:"Från vilken ålder får du övningsköra personbil?",
 a:["16 år","15 år","17 år","16 och ett halvt år"],
 e:"Du får övningsköra från 16 år om du har körkortstillstånd och en godkänd handledare eller kör på trafikskola."},
{id:"f12",c:"fordon",q:"Hur långt får lasten sticka ut bakom bilen innan den måste märkas?",
 a:["1 meter","0,5 meter","2 meter","1,5 meter"],
 e:"Last som sticker ut mer än 1 meter bakom fordonet ska märkas så att den syns, till exempel med en röd flagga eller lykta i mörker."},
{id:"f13",c:"fordon",q:"Bilen får motorstopp på en landsväg i hög fart. Vad gör du?",
 a:["Varnar andra och gör dig själv synlig","Ställer triangeln precis bakom bilen","Sitter kvar i bilen med varningsblinkers","Försöker rulla bilen till närmaste avfart"],
 e:"Gör dig och bilen synlig. Varningstriangeln ska stå en bra bit bakom bilen så att andra hinner reagera. Ställ dig på säker plats bakom vägräcket om det finns."},
{id:"f14",c:"fordon",q:"När ger mätningen av däcktrycket bäst resultat?",
 a:["När däcken är kalla, före körning","Efter en längre körning","Mitt på dagen när det är varmt","Efter att ha kört en kort sträcka"],
 e:"Däcken blir varma och trycket stiger när du kör. Mät därför när bilen har stått still en stund."},
{id:"f15",c:"fordon",q:"En röd varningslampa tänds på instrumentpanelen under körning. Vad gör du?",
 a:["Stannar så snart det är säkert och kollar","Kör vidare och kollar när du kommer fram","Startar om bilen och ser om lampan släcks","Kör långsamt till närmaste verkstad"],
 e:"Röda lampor varnar för allvarliga fel, till exempel lågt oljetryck eller bromsfel. Stanna säkert och läs i instruktionsboken."},
{id:"f16",c:"fordon",q:"Hur många rätt behöver du på Trafikverkets kunskapsprov för B-körkort?",
 a:["52 av 65","50 av 65","55 av 65","56 av 70"],
 e:"Provet har 70 frågor, varav 65 räknas (5 är testfrågor). Du behöver 52 rätt och har 50 minuter på dig."},
{id:"f17",c:"fordon",q:"Hur bör små barn helst åka i bil?",
 a:["Bakåtvända i bilbarnstol","Framåtvända från 1 år","I bälteskudde från 2 år","Framåtvända i bilbarnstol"],
 e:"Bakåtvänd åkning skyddar barnets nacke och huvud mycket bättre vid en krock. Rekommendationen är bakåtvänt till omkring 4 års ålder."},

/* ---------- Fler: vägmärken, markeringar & signaler ---------- */
{id:"s22",c:"skyltar",img:"sign:vajning",q:"Du kommer fram till en korsning med det här märket. Måste du alltid stanna?",
 a:["Nej, bara om det behövs","Ja, alltid helt vid linjen","Ja, om det finns en stopplinje","Nej, du har företräde"],
 e:"Väjningsplikt betyder att du ska lämna företräde, inte att du alltid måste stanna. Är vägen fri får du köra vidare. Stopplikt kräver däremot alltid ett helt stopp."},
{id:"s23",c:"skyltar",img:"scene:haj",q:"Vad betyder raden med vita trianglar tvärs över ditt körfält?",
 a:["Väjningslinje – stanna här vid behov","Stopplinje – du måste alltid stanna","Farthinder – sänk farten","Övergångsställe för cyklister"],
 e:"Trianglarna kallas ofta hajtänder och visar var du ska stanna om du måste lämna företräde vid väjningsplikt. En stopplinje är i stället en bred heldragen linje."},
{id:"s24",c:"skyltar",q:"Vad betyder en heldragen linje mitt på vägen (spärrlinje)?",
 a:["Du får inte korsa linjen","Du får korsa den vid omkörning","Den får korsas om det är fri sikt","Du får korsa den för att svänga"],
 e:"En spärrlinje sitter där det är farligt att korsa, till exempel vid skymd sikt. Du får inte köra över den."},
{id:"s25",c:"skyltar",img:"scene:sparr",q:"Du kör i det nedre körfältet. Mittlinjen är heldragen med en streckad linje på din sida. Får du köra om?",
 a:["Ja, när det är säkert att köra om","Nej, heldragen linje får aldrig korsas","Bara om fordonet framför kör under 50 km/h","Nej, bara mötande får korsa"],
 e:"När en spärrlinje och en varningslinje ligger bredvid varandra gäller den linje som är närmast dig. Streckat på din sida betyder att du får korsa."},
{id:"s26",c:"skyltar",img:"scene:gul",q:"En gul heldragen linje är målad längs kantstenen. Vad betyder den?",
 a:["Förbud att stanna och parkera","Förbud att parkera, men du får stanna","Parkering för rörelsehindrade","Förbud mot omkörning"],
 e:"Gul heldragen linje vid kantstenen betyder att du inte får stanna eller parkera. En gul streckad linje betyder att du inte får parkera."},
{id:"s27",c:"skyltar",q:"En gul streckad linje är målad längs kantstenen. Vad betyder den?",
 a:["Förbud att parkera, stanna går bra","Förbud att stanna och parkera","Parkering tillåten högst 1 timme","Lastplats för varutransporter"],
 e:"Streckad gul linje vid kanten betyder förbud att parkera. Heldragen gul linje betyder förbud att både stanna och parkera."},
{id:"s28",c:"skyltar",q:"Vilken form och färg har varningsmärken i Sverige?",
 a:["Trekantiga, röd kant, gul botten","Runda, röd kant, gul botten","Trekantiga, spetsen nedåt, röd kant","Trekantiga, blå botten"],
 e:"Varningsmärken är trianglar med spetsen uppåt, röd kant och gul botten. De sätts upp en bit före faran."},
{id:"s29",c:"skyltar",q:"Vad betyder runda blå vägmärken?",
 a:["Påbud – något du måste göra","Förbud – något du inte får göra","Upplysning om väg eller plats","Varning för fara"],
 e:"Blå runda märken är påbudsmärken. Förbudsmärken är runda med röd kant."},
{id:"s30",c:"skyltar",q:"Vad betyder fyrkantiga blå vägmärken oftast?",
 a:["Upplysning","Påbud – något du måste göra","Förbud för vissa fordon","Varning för fara"],
 e:"Fyrkantiga blå märken är anvisningsmärken. De berättar något om vägen eller platsen."},
{id:"s31",c:"skyltar",q:"En tilläggstavla visar svarta siffror utan parentes, till exempel 8–18. När gäller det?",
 a:["Vardagar 8–18","Alla dagar klockan 8–18","Måndag–lördag klockan 8–18","Vardagar, och lördagar 8–14"],
 e:"Svarta siffror = vardagar. Siffror inom parentes = dag före sön- och helgdag, oftast lördag. Röda siffror = sön- och helgdagar."},
{id:"s32",c:"skyltar",q:"En tilläggstavla visar röda siffror, till exempel 10–16. När gäller det?",
 a:["Sön- och helgdagar 10–16","Lördagar 10–16","Vardagar 10–16","Dag före helgdag 10–16"],
 e:"Röda siffror gäller sön- och helgdagar. Svarta gäller vardagar och siffror inom parentes gäller dag före sön- och helgdag."},
{id:"s33",c:"skyltar",q:"Bommarna vid en järnvägskorsning börjar fällas ned och de röda ljusen blinkar. Vad gör du?",
 a:["Stannar och väntar tills bommarna är uppe","Kör över om du hinner innan bommarna är nere","Stannar och kör när ljusen slocknat","Kör om det inte syns något tåg"],
 e:"Blinkande rött vid en plankorsning betyder stopp. Kör aldrig runt bommar, ett tåg kan inte väja eller stanna snabbt."},

/* ---------- Fler: trafikregler ---------- */
{id:"r25",c:"regler",img:"scene:utfart",q:"Du kör ut från en parkeringsplats eller en gårdsplan till en väg. Vad gäller?",
 a:["Du har väjningsplikt mot alla","Högerregeln gäller","Bara mot fordon, inte gående","Bara mot trafik från vänster"],
 e:"Det kallas utfartsregeln. Den som kör ut från en parkering, gård, bensinstation eller liknande ska lämna företräde åt alla på vägen, även gående och cyklister."},
{id:"r26",c:"regler",img:"scene:vanster",q:"Du ska svänga vänster i en korsning och en mötande bil ska köra rakt fram. Vem har företräde?",
 a:["Den mötande bilen","Du, eftersom du kom först","Den som är till höger","Du, om du har blinkat"],
 e:"Den som svänger vänster ska lämna företräde åt mötande trafik."},
{id:"r27",c:"regler",q:"Du svänger höger i en korsning. Vilka måste du lämna företräde?",
 a:["Gående och cyklister","Bara gående","Bara cyklister","Fordon bakom dig"],
 e:"När du svänger ska du lämna företräde åt gående och cyklister som korsar den väg du kör in på. Kolla speglar och döda vinkeln."},
{id:"r28",c:"regler",q:"Hur nära en vägkorsning får du som närmast stanna eller parkera?",
 a:["10 meter","5 meter","15 meter","20 meter"],
 e:"Du får inte stanna eller parkera i en korsning eller inom 10 meter från den korsande körbanans ytterkant. Annars skymmer bilen sikten."},
{id:"r29",c:"regler",q:"Hur nära en plankorsning (järnvägskorsning) får du som närmast parkera?",
 a:["30 meter","10 meter","20 meter","50 meter"],
 e:"Du får inte parkera närmare än 30 meter från en plankorsning, och du får aldrig stanna i själva korsningen."},
{id:"r30",c:"regler",q:"När är det tillåtet att köra om strax före eller i en korsning?",
 a:["På huvudled eller vid signal","Aldrig","Om sikten är god","Om det inte finns övergångsställe"],
 e:"Omkörning strax före och i korsningar är förbjuden, men det finns undantag: om du kör på huvudled, om trafiken regleras av signal eller polis, eller om du kör om ett tvåhjuligt fordon."},
{id:"r31",c:"regler",q:"Du blir omkörd. Vad ska du göra?",
 a:["Hålla till höger, inte öka farten","Bromsa så den kommer förbi snabbare","Hålla farten och mitten av körfältet","Öka farten lite"],
 e:"Den som blir omkörd får inte öka farten och ska hålla till höger så att omkörningen kan ske säkert."},
{id:"r32",c:"regler",q:"Var placerar du bilen inför en vänstersväng på en väg med mötande trafik?",
 a:["Nära vägens mitt","Längst till höger","Mitt i körfältet","Långt ut i mötande körfält"],
 e:"Placera dig nära mitten i god tid, så kan trafik bakom dig passera på höger sida medan du väntar."},
{id:"r33",c:"regler",q:"Utanför tättbebyggt område har vägen två körfält i din riktning. Vilket körfält använder du normalt?",
 a:["Det högra","Vilket du vill","Det vänstra om du kör fort","Det som har minst trafik"],
 e:"Utanför tättbebyggt område håller du till höger och använder vänster körfält för omkörning. I tättbebyggt område får du välja körfält."},
{id:"r34",c:"regler",q:"Du missar din avfart på motorvägen. Vad gör du?",
 a:["Kör vidare till nästa avfart","Backar på vägrenen","Stannar och vänder när det är tomt","Kör av vid nödfickan och vänder"],
 e:"På motorväg får du aldrig backa eller vända. Kör till nästa avfart och vänd där."},
{id:"r35",c:"regler",q:"En buss med skylten Skolskjuts har stannat och dess varningslampor blinkar. Hur fort får du köra förbi?",
 a:["Högst 30 km/h","Högst 50 km/h","Högst 20 km/h","Högst 40 km/h"],
 e:"Barn kan springa ut framför eller bakom bussen. Därför får du köra förbi i högst 30 km/h."},
{id:"r36",c:"regler",q:"När får du använda dimbakljus?",
 a:["Vid kraftigt nedsatt sikt","Alltid i mörker utan gatubelysning","När det regnar","När någon kör nära bakom"],
 e:"Dimbakljuset är mycket starkt och bländar trafiken bakom. Använd det bara vid kraftigt nedsatt sikt och släck när sikten blir bättre."},
{id:"r37",c:"regler",q:"När ska du använda varningsblinkers?",
 a:["När bilen kan vara en fara","När du parkerar kort på gatan","När du kör långsamt i regn","När du backar"],
 e:"Varningsblinkers är till för att varna, till exempel om du har fått stopp på vägen eller närmar dig en plötslig kö på motorväg."},
{id:"r38",c:"regler",q:"Bilen får stopp på motorvägen. Var är det säkrast för dig och passagerarna att vänta?",
 a:["Bakom vägräcket, en bit bort","Kvar i bilen med bältet på","Framför bilen på vägrenen","Bakom bilen på vägrenen"],
 e:"En stillastående bil på motorväg kan bli påkörd. Sätt på reflexväst, ta dig bakom vägräcket och ring efter hjälp."},

/* ---------- Fler: säkerhet & människan ---------- */
{id:"h18",c:"sakerhet",q:"Var bildas ofta halka först när temperaturen ligger runt noll grader?",
 a:["På broar och i skugga","På raksträckor i solen","Vid vägkanten i städer","I uppförsbackar"],
 e:"Broar kyls från både över- och undersidan och skuggiga partier värms inte av solen. Där kan det vara halt fast resten av vägen är torr."},
{id:"h19",c:"sakerhet",q:"Vad är svart is?",
 a:["Tunn, genomskinlig is","Is under ett tunt snötäcke","Smutsig, sotig is","Tjock is i hjulspår"],
 e:"Svart is syns knappt, vägen ser bara mörk och blöt ut. Var misstänksam när det är kallt och vägen glänser."},
{id:"h20",c:"sakerhet",q:"Varför ska du hålla längre avstånd på vinterväglag?",
 a:["Bromssträckan blir mycket längre","Vinterdäck ger kortare bromssträcka","Det är svårare att se bromsljus","Bilen framför kan få motorstopp"],
 e:"På is kan bromssträckan bli många gånger längre än på torr asfalt, även med bra vinterdäck."},
{id:"h21",c:"sakerhet",q:"Du blir bländad av mötande trafik i mörker. Vad gör du?",
 a:["Sänker farten och tittar mot högerkanten","Tittar på mötandes strålkastare","Blinkar med helljuset","Ökar farten för att snabbt komma förbi"],
 e:"Blicken mot högra vägkanten hjälper dig att hålla kursen. Sänk farten, eftersom du ser sämre en stund efteråt."},
{id:"h22",c:"sakerhet",q:"Du drack mycket alkohol sent i går kväll. Vad gäller på morgonen?",
 a:["Du kan fortfarande ha alkohol i blodet","Du är alltid nykter efter en natts sömn","Du är nykter om du äter frukost","Du är nykter om du känner dig pigg"],
 e:"Kroppen bryter ner alkohol långsamt. Efter en kväll med mycket alkohol kan du vara över gränsen långt in på nästa dag."},
{id:"h23",c:"sakerhet",q:"Du tittar ner på mobilen i 2 sekunder i 90 km/h. Ungefär hur långt kör du utan att se vägen?",
 a:["Cirka 50 meter","Cirka 25 meter","Cirka 15 meter","Cirka 100 meter"],
 e:"90 km/h är 25 meter per sekund. Två sekunder blir alltså cirka 50 meter i blindo."},
{id:"h24",c:"sakerhet",q:"Varför ska passagerare i baksätet också ha bälte?",
 a:["De kan skada sig själva och andra","Det är bara krav vid motorväg","Det är bara viktigt för barn","Krockkuddarna skyddar baksätet"],
 e:"Vid en krock kastas en obältad passagerare fram med enorm kraft och kan skada både sig själv och föraren."},
{id:"h25",c:"sakerhet",q:"Hur ska nackskyddet vara inställt?",
 a:["I höjd med huvudets topp","I höjd med nacken","I höjd med axlarna","Så lågt som möjligt"],
 e:"Ett rätt inställt nackskydd minskar risken för whiplashskador vid påkörning bakifrån."},
{id:"h26",c:"sakerhet",q:"Vilka förare är överrepresenterade i trafikolyckor?",
 a:["Unga, oerfarna förare","Äldre förare över 75 år","Yrkesförare","Förare i medelåldern"],
 e:"Unga förare har mindre erfarenhet och tar oftare risker. Därför finns provtiden och riskutbildningarna."},
{id:"h27",c:"sakerhet",q:"Hur påverkas en gående som blir påkörd i 30 km/h jämfört med i 50 km/h?",
 a:["Mycket större chans att överleva","Ingen skillnad","Skillnaden är liten","Skadorna blir bara lindrigare"],
 e:"I 30 km/h överlever de flesta gående en påkörning. I 50 km/h är risken att dö många gånger större."},
{id:"h28",c:"sakerhet",q:"Vilket är ett tidigt tecken på att du börjar bli trött?",
 a:["Du gäspar ofta","Du blir hungrig","Du kör jämnare än vanligt","Du blir rastlös och irriterad"],
 e:"Gäspningar, tunga ögonlock, svårt att hålla kursen och minnesluckor är varningssignaler. Stanna och vila."},
{id:"h29",c:"sakerhet",q:"En skadad person är medvetslös men andas. Vad gör du?",
 a:["Stabilt sidoläge","Ryggläge med benen högt","Sittande mot en vägg","Ryggläge med huvudet bakåt"],
 e:"Stabilt sidoläge hindrar att tungan eller kräkningar blockerar luftvägarna. Ring 112 och håll koll på andningen."},
{id:"h30",c:"sakerhet",q:"En boll rullar ut på gatan framför dig. Vad bör du räkna med?",
 a:["Att ett barn kan springa ut efter bollen","Att bollen kan studsa upp på motorhuven","Att en hund kan springa efter","Att bollen kan rulla under bilen"],
 e:"Barn följer bollen med blicken, inte trafiken. Där bollen kommer kan ett barn komma strax efter."},
{id:"h31",c:"sakerhet",q:"Bakdelen på bilen börjar glida ut i en kurva (sladd). Vad gör du?",
 a:["Släpper gasen och styr dit du vill","Bromsar hårt och styr rakt","Gasar för att räta upp bilen","Styr åt motsatt håll som du vill"],
 e:"Titta och styr dit du vill att bilen ska åka. Släpp gasen och undvik tvära rörelser. Det här övar du på halkbanan i Risktvåan."},

/* ---------- Fler: miljö ---------- */
{id:"m12",c:"miljo",q:"Vad händer med bränsleförbrukningen om du kör med låg växel och högt varvtal?",
 a:["Den ökar tydligt","Den minskar","Den påverkas inte","Den ökar bara på motorväg"],
 e:"Högt varvtal kostar bränsle. Växla upp tidigt och håll låga varvtal när det går."},
{id:"m13",c:"miljo",q:"Vad gör katalysatorn i bilen?",
 a:["Den minskar skadliga avgaser","Den minskar koldioxidutsläppen","Den gör motorn starkare","Den filtrerar partiklar från däcken"],
 e:"Katalysatorn omvandlar skadliga avgaser till mindre skadliga ämnen. Koldioxiden minskar den däremot inte."},
{id:"m14",c:"miljo",q:"Hur påverkar luftkonditioneringen (AC) bränsleförbrukningen?",
 a:["Den ökar förbrukningen","Den påverkas inte","Den minskar förbrukningen","Den ökar bara i elbilar"],
 e:"AC-kompressorn drivs av motorn eller batteriet och drar energi. Använd den när den behövs, inte i onödan."},
{id:"m15",c:"miljo",q:"Varför ska du undvika att köra med onödig last i bilen?",
 a:["Mer vikt ökar förbrukningen","Bilen blir instabil i kurvor","Det sliter mer på bromsarna","Det påverkar inte förbrukningen"],
 e:"Ju tyngre bil, desto mer energi går åt för att accelerera. Töm bagageutrymmet på sådant som inte behövs."},
{id:"m16",c:"miljo",q:"Vad orsakar det mesta av bullret från en personbil i hög fart?",
 a:["Däcken","Motorn","Luftmotståndet","Avgassystemet"],
 e:"I högre farter dominerar däckbullret. Dubbdäck bullrar ännu mer."},
{id:"m17",c:"miljo",q:"Du ska vänta en längre stund i bilen. Vad är bäst för miljön?",
 a:["Stänga av motorn tills du kör vidare","Låta motorn gå så kupén hålls varm","Låta motorn gå om det är under 5 minuter","Stänga av den efter 10 minuter"],
 e:"En motor på tomgång släpper ut avgaser utan nytta. Stäng av den när du står still en längre stund."},

/* ---------- Fler: fordon & körkort ---------- */
{id:"f18",c:"fordon",q:"Vad behöver du innan du får börja övningsköra?",
 a:["Ett giltigt körkortstillstånd","Godkänt kunskapsprov","Godkänd Risketta","Gått en introduktionsutbildning"],
 e:"Du ansöker om körkortstillstånd hos Transportstyrelsen. Det innebär bland annat en hälsodeklaration och synkontroll."},
{id:"f19",c:"fordon",q:"Vem måste gå en introduktionsutbildning för att ni ska få övningsköra privat?",
 a:["Bara eleven","Både eleven och handledaren","Bara handledaren","Ingen av dem"],
 e:"Enligt de nya reglerna är det eleven som ska gå introduktionsutbildningen hos en trafikskola innan privat övningskörning. Handledaren behöver inte längre gå den, men måste fortfarande vara godkänd som handledare."},
{id:"f20",c:"fordon",q:"Vilka riskutbildningar måste du gå för B-körkort?",
 a:["Riskettan och Risktvåan","Bara Riskettan","Bara Risktvåan","Inga, de är frivilliga"],
 e:"Båda delarna är obligatoriska och måste vara klara innan du får göra körprovet."},
{id:"f21",c:"fordon",q:"Hur länge gäller själva körkortet (kortet) innan det måste förnyas?",
 a:["10 år","5 år","15 år","20 år"],
 e:"Körkortet som fysiskt kort gäller i 10 år. Sedan förnyar du det, behörigheten finns kvar."},
{id:"f22",c:"fordon",q:"Får du ha dubbdäck på bara framhjulen och odubbade däck bak?",
 a:["Nej, alla hjul ska ha dubbdäck","Ja, om dubbdäcken sitter fram","Ja, om dubbdäcken sitter bak","Ja, utom på motorväg"],
 e:"Blandade däck ger ojämnt grepp och kan få bilen att få sladd. Dubbdäck ska sitta på alla hjul."},
{id:"f23",c:"fordon",q:"Hur placerar du tung last i bilen?",
 a:["Lågt och långt fram","Högt upp och långt bak","I baksätet, löst","Ovanpå lätt last"],
 e:"Tung last som inte är fastsatt blir en farlig projektil vid en krock. Lägg den lågt, långt fram och spänn fast den."},
{id:"f24",c:"fordon",q:"Vem ansvarar för att bilen är i trafiksäkert skick när du kör?",
 a:["Du som förare","Ägaren av bilen","Besiktningsföretaget","Bilverkstaden"],
 e:"Föraren ansvarar för att fordonet är i trafiksäkert skick under färd, till exempel att lysen, däck och bromsar fungerar."},
{id:"f25",c:"fordon",q:"Bilen har fått körförbud vid besiktningen. Vad innebär det?",
 a:["Den får bara köras till reparation","Den får köras i 30 dagar till","Den får bara köras dagtid","Den får köras men inte på motorväg"],
 e:"Körförbud betyder att bilen har allvarliga fel. Den får bara köras till verkstad och ombesiktning."},
{id:"f26",c:"fordon",q:"Får du köra en avställd bil på allmän väg?",
 a:["Nej, utom till besiktning","Ja, om den är försäkrad","Ja, korta sträckor nära hemmet","Ja, om den inte är för gammal"],
 e:"En avställd bil får inte användas i trafik. Undantaget är färd till och från besiktning."},
