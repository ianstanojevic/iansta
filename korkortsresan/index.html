{id:"m18",c:"miljo",q:"Vilket däcktryck ger lägst bränsleförbrukning och bäst säkerhet?",
 a:["Tillverkarens tryck","Lite lägre än rekommenderat","Lite högre än rekommenderat","Samma tryck i alla bilar"],
 e:"Följ tillverkarens rekommendation, ofta på en dekal i dörrkarmen eller i tankluckan. Höj trycket vid tung last om det står så."},
{id:"m19",c:"miljo",q:"Varför är det bra att planera körningen och samordna ärenden?",
 a:["Färre kallstarter","Du kan köra fortare","Det ger mer tomgångskörning","Det ger fler kallstarter"],
 e:"Många korta resor med kall motor ger mycket utsläpp. Samla ärenden i en resa när det går."},
{id:"m20",c:"miljo",q:"Hur påverkar ett öppet fönster i hög fart bränsleförbrukningen?",
 a:["Den ökar","Den minskar","Ingen skillnad","Den ökar bara med AC på"],
 e:"I högre fart ökar öppna fönster luftmotståndet. I stadsfart är effekten liten."},
{id:"m21",c:"miljo",q:"Vad är ett bra sätt att köra sparsamt mot ett rödljus?",
 a:["Släppa gasen tidigt och rulla","Bromsa hårt sent","Växla ner tidigt och gasa","Lägga i friläge och rulla"],
 e:"Om du rullar tidigt med växeln i går nästan inget bränsle åt, och ofta hinner det bli grönt innan du måste stanna."},
{id:"m22",c:"miljo",q:"Vad innebär det att ett fordon är en miljöbil eller har låga utsläpp?",
 a:["Mindre utsläpp per km","Den får köra fortare","Den behöver inte besiktas","Den har mindre buller"],
 e:"Låga utsläpp per kilometer betyder mindre klimatpåverkan. Sättet du kör på spelar ändå stor roll."},
{id:"m23",c:"miljo",q:"Vilket påstående om biodrivmedel (till exempel HVO eller etanol) stämmer?",
 a:["De kan minska klimatpåverkan","De ger inga utsläpp alls","Alla bilar får använda dem","De ökar alltid förbrukningen"],
 e:"Förnybara drivmedel tillverkas av till exempel restprodukter och växter och kan ge lägre klimatpåverkan. Kontrollera att din bil är godkänd för drivmedlet."},
{id:"m24",c:"miljo",q:"Varför ska du undvika att tvätta bilen på gatan eller garageuppfarten?",
 a:["Smutsvattnet kan nå naturen","Det är dåligt för lacken","Det är förbjudet i hela landet","Det använder mer vatten"],
 e:"Tvätta helst i en tvätthall som renar vattnet. Dagvatten går ofta orenat till sjöar och vattendrag."},
{id:"m25",c:"miljo",q:"Hur påverkar aggressiv körning med hårda accelerationer och inbromsningar förbrukningen?",
 a:["Den ökar tydligt","Den minskar","Den påverkas inte","Den ökar bara på motorväg"],
 e:"Varje hård inbromsning slösar energi som du först har betalat för med bränsle. Mjuk körning sparar både bränsle och bromsar."},
{id:"m26",c:"miljo",q:"Hur bör du starta och köra iväg med en kall motor?",
 a:["Kör iväg lugnt direkt","Tomgång i 5 minuter först","Varva motorn så den blir varm","Kör fort för att värma upp"],
 e:"Motorn blir varm snabbare när du kör lugnt än när den står på tomgång. Tomgångskörning ger onödiga utsläpp."},
{id:"m27",c:"miljo",q:"Vilket däck ger normalt högst bränsleförbrukning och mest slitage på vägen?",
 a:["Dubbdäck","Sommardäck","Odubbade vinterdäck","Helårsdäck"],
 e:"Dubbdäck har högre rullmotstånd, bullrar mer och river upp partiklar från vägbanan."},
{id:"f27",c:"fordon",q:"Vad betyder en blinkande körriktningsvisare som blinkar mycket snabbare än vanligt?",
 a:["En lampa är trasig","Varningsblinkersen är på","Bilen behöver service","Batteriet är svagt"],
 e:"Snabbt blinkande blinkers är ofta ett tecken på att en glödlampa har gått sönder. Byt den så snart som möjligt."},
{id:"f28",c:"fordon",q:"Hur kontrollerar du enklast mönsterdjupet på däcken?",
 a:["Med en mönsterdjupsmätare","Genom att mäta däcktrycket","Genom att titta på däckens ålder","Genom att trycka på däcket"],
 e:"Slitagevarnarna är små upphöjningar i mönsterbotten. När mönstret är nere i dem är däcket slitet."},
{id:"f29",c:"fordon",q:"Vad kan det bero på om bilen drar åt ena sidan när du bromsar?",
 a:["Fel på bromsarna","Fel däcktryck","Ojämn last i bagaget","Styrservon är trasig"],
 e:"Om bilen drar åt sidan vid bromsning kan bromsarna vara ojämna eller ett däck ha fel tryck. Låt en verkstad kontrollera."},
{id:"f30",c:"fordon",q:"Vad gäller för vindrutan om den har en stor spricka i förarens synfält?",
 a:["Den ska bytas, den skymmer sikten","Det är okej om du ser förbi den","Det räcker att tejpa över den","Bara ett estetiskt fel"],
 e:"Skador i förarens synfält försämrar sikten och kan leda till anmärkning eller körförbud."},
{id:"f31",c:"fordon",q:"Vad ska du göra om ABS-lampan lyser under körning?",
 a:["Kör försiktigt, låt verkstad kolla","Bromsarna fungerar inte alls","Lampan lyser alltid när det är kallt","Stanna direkt mitt på vägen"],
 e:"Vanliga bromsar fungerar normalt fortfarande, men hjulen kan låsa sig vid hård inbromsning. Åtgärda felet snart."},
{id:"f32",c:"fordon",q:"Vad är normalt att kontrollera innan en längre resa?",
 a:["Lysen, däck, vätskor och last","Bara bränsle och däcktryck","Bara olja och spolarvätska","Bara att besiktningen är giltig"],
 e:"En snabb kontroll före avfärd kan förhindra stopp och olyckor."},
{id:"f33",c:"fordon",q:"Vad gäller för körkortet när du kör bil?",
 a:["Ha det med och visa vid kontroll","Det räcker med personnumret","Det behövs bara på motorväg","Du har en vecka på dig att visa det"],
 e:"Föraren ska ha med sig körkortet och visa upp det vid kontroll."},
{id:"f34",c:"fordon",q:"Vad händer om du kör bil under provtiden och får körkortet återkallat?",
 a:["Du måste göra om båda proven","Du får tillbaka det efter spärrtiden","Du måste bara göra om körprovet","Du måste bara göra om kunskapsprovet"],
 e:"Under provtiden leder återkallelse till att du måste ta om båda proven efter spärrtiden."},
{id:"f35",c:"fordon",q:"Vad innebär det att en bil har ett dragkrok-godkännande och en högsta släpvagnsvikt?",
 a:["Bara upp till den vikt som anges","Bilen får dra hur tungt släp som helst","Det gäller bara obromsade släp","Det bestäms av körkortet, inte bilen"],
 e:"Kontrollera i registreringsbeviset hur tungt släp bilen får dra. Ditt körkort sätter också gränser."},
{id:"f36",c:"fordon",q:"Vem ansvarar för att barn under 135 cm använder bilbarnstol eller bälteskudde?",
 a:["Föraren","Barnets förälder","Barnet självt","Den vuxne bredvid barnet"],
 e:"Föraren ansvarar alltid för att passagerare under 15 år använder lämplig skyddsutrustning."},
{id:"f37",c:"fordon",q:"Hur bör du justera förarstolen?",
 a:["Lätt böjda knän och armar","Raka armar och ben","Så långt bak som möjligt","Så nära ratten som möjligt"],
 e:"Rätt sittställning ger bättre kontroll och minskar skaderisken vid en krock."},
{id:"f38",c:"fordon",q:"Vad är syftet med kontrollbesiktning?",
 a:["Kontrollera trafiksäkerheten","Att värdera bilen","Att kontrollera förarens körförmåga","Att mäta bilens topphastighet"],
 e:"Besiktningen kontrollerar bland annat bromsar, styrning, lysen och avgaser."},
{id:"f39",c:"fordon",q:"Hur länge får du övningsköra med körkortstillstånd?",
 a:["5 år","2 år","3 år","10 år"],
 e:"Körkortstillståndet gäller i fem år. Under den tiden behöver du klara både kunskapsprov och körprov."},
{id:"f40",c:"fordon",q:"Hur snart efter godkänt kunskapsprov måste du klara körprovet?",
 a:["Inom 2 månader","Inom 6 månader","Inom 1 år","Inom 2 år"],
 e:"Båda proven ska vara godkända inom två månader från det första godkända provet. Annars gäller inte det första längre."},
{id:"r39",c:"regler",q:"Vad gäller när du kör på en väg där det saknas trottoar och du möter gående i mörker?",
 a:["Sänka farten och blända av i tid","Behålla helljuset för att se dem","Tuta så att de flyttar sig","Köra nära mitten av vägen"],

{id:"r40",c:"regler",q:"Får du köra i cykelfältet för att svänga höger?",

{id:"r41",c:"regler",q:"Vad gäller i ett körfält för kollektivtrafik (bussfil)?",

 e:"Läs märkningen och skyltarna. Ofta får du använda bussfilen en kort sträcka för att svänga."},
{id:"r42",c:"regler",q:"Vad innebär det att du har väjningsplikt?",

{id:"r43",c:"regler",q:"Du kör på en väg och en buss står vid en hållplats på en väg med 70 km/h. Den blinkar för att köra ut. Vad gäller?",
 a:["Ingen skyldighet, men visa hänsyn","Du måste alltid släppa ut bussen","Bussen har alltid företräde","Du måste stanna helt"],
 e:"Skyldigheten att släppa ut bussen gäller på vägar med högst 50 km/h. På snabbare vägar är det en fråga om hänsyn."},
{id:"r44",c:"regler",q:"Får du parkera på en cykelbana?",

 e:"Att stanna eller parkera på cykelbana är förbjudet och tvingar cyklister ut i trafiken."},
{id:"r45",c:"regler",q:"Får du parkera på trottoaren?",

 e:"Parkering på gångbana är förbjuden. Gående, rullstolar och barnvagnar ska kunna ta sig fram."},
{id:"r46",c:"regler",q:"Hur ska du parkera på en gata med dubbelriktad trafik?",

{id:"r47",c:"regler",q:"Vad gäller vid gul blinkande signal vid ett övergångsställe (utan andra signaler)?",
 a:["Var uppmärksam, lämna företräde","Signalen är på väg att bli röd","Du har företräde mot gående","Du måste stanna helt"],
 e:"Blinkande gult betyder särskild försiktighet. Reglerna för obevakat övergångsställe gäller."},
{id:"r48",c:"regler",q:"Vad är ett bevakat övergångsställe?",

 e:"På bevakade övergångsställen följer du signalerna. På obevakade ska du lämna gående företräde."},
{id:"r49",c:"regler",q:"Ett fordon har stannat framför ett obevakat övergångsställe i körfältet bredvid dig. Vad gör du?",
 a:["Saktar ner och är beredd att stanna","Kör förbi i samma fart","Kör förbi, men tutar","Byter till det körfältet och väntar"],
 e:"Ett fordon som stannar vid ett övergångsställe gör det ofta för att släppa fram någon du inte ser."},
{id:"r50",c:"regler",q:"Får du köra om på en motorväg på höger sida?",

 e:"Omkörning sker till vänster. I kö där körfälten går lika långsamt räknas det inte som omkörning om högra körfältet råkar gå fortare."},
{id:"r51",c:"regler",q:"Vad gäller i en tunnel?",
 a:["Du får inte vända eller backa","Du får stanna på vägrenen","Du ska alltid köra med helljus","Du får köra om var som helst"],
 e:"Tunnlar är riskfyllda miljöer. Håll avstånd och följ skyltar och signaler."},
{id:"r52",c:"regler",q:"Du ska köra in på en väg från en påfart med väjningspliktsmärke. Bilar på vägen kommer i hög fart. Vad gör du?",
 a:["Väntar på en tillräcklig lucka","Kör ut, de andra får anpassa sig","Kör ut långsamt så att de ser dig","Blixtlåsprincipen gäller"],
 e:"Väjningsplikt innebär att trafiken på vägen inte ska behöva sakta ner för dig."},
{id:"s34",c:"skyltar",q:"Vad betyder en blå skylt med texten \"Rekommenderad hastighet\"?",

 e:"Rekommenderad hastighet är en vägledning, ofta inför kurvor eller vägarbeten."},
{id:"s35",c:"skyltar",q:"Vad betyder en röd fast signal?",

 e:"Rött betyder stopp. Stanna vid stopplinjen eller före signalen."},

 e:"Grönt betyder att du får köra. Du ska ändå lämna gående och cyklister företräde när du svänger."},
{id:"s37",c:"skyltar",q:"Vad betyder ett märke med en siffra och en tilläggstavla med texten Zon?",

 e:"Zonmärken används till exempel för hastighet eller parkering i ett helt område."},
{id:"s38",c:"skyltar",q:"Vad gäller vid ett märke för gågata?",

{id:"s39",c:"skyltar",q:"Vad är en sidoplacerad gul linje (kantlinje) på en landsväg?",

 e:"Gula vägmarkeringar används tillfälligt och gäller då före de vita markeringarna."},
{id:"s40",c:"skyltar",q:"Vad betyder en vägmarkering med en heldragen bred linje tvärs över körfältet vid en stoppskylt?",

 e:"Stopplinjen visar var du ska stanna vid stopplikt eller rött ljus."},

{id:"h33",c:"sakerhet",q:"Vad är den vanligaste orsaken till påkörningar bakifrån?",
 a:["För kort avstånd","Dåliga däck","Mörker","Halt väglag"],

{id:"h34",c:"sakerhet",q:"Hur påverkar mobiltelefonsamtal körningen, även med handsfree?",

 e:"Cyklister kan behöva väja för gropar eller vind. Ge dem gott om plats."},
{id:"h36",c:"sakerhet",q:"Varför är det särskilt farligt att köra på landsväg i mörker?",
 a:["Sikten är begränsad","Det finns mer trafik på natten","Vägarna är smalare på natten","Fler kör onyktra på dagen"],
 e:"I halvljus ser du bara en kort bit framåt. Anpassa farten så att du kan stanna på den sträcka du ser."},
{id:"h37",c:"sakerhet",q:"Hur påverkas du av stress när du kör?",
 a:["Du tar större risker","Du kör säkrare och mer koncentrerat","Ingenting, stress påverkar inte","Du blir bättre på att bedöma avstånd"],
 e:"Stress får många att köra fortare och tränga sig. Ge dig själv mer tid."},
{id:"h38",c:"sakerhet",q:"Vad ska du göra om du blir trött efter att ha kört länge?",
 a:["Stanna och ta en paus","Öppna fönstret och kör vidare","Dricka kaffe och köra vidare","Köra fortare för att hinna hem"],
 e:"Regelbundna pauser motverkar trötthet. Om du blir sömnig hjälper bara sömn."},
{id:"h39",c:"sakerhet",q:"Vad betyder det att anpassa hastigheten efter förhållandena?",
 a:["Köra långsammare när det behövs","Köra exakt skyltad hastighet","Köra lika fort som andra","Köra fortare när vägen är tom"],
 e:"Skyltad hastighet är högsta tillåtna, inte alltid lämpligaste."},
{id:"h40",c:"sakerhet",q:"Vad gör du om ett djur plötsligt springer upp på vägen och du inte hinner stanna?",
 a:["Bromsar hårt, håller kursen","Väjer kraftigt åt sidan","Gasar för att hinna förbi","Släpper bromsen och styr runt"],
 e:"En tvär undanmanöver kan leda till avåkning eller frontalkrock, som ofta är farligare."},
{id:"h41",c:"sakerhet",q:"Vilken risk ökar när du kör med solen lågt framför dig?",
 a:["Du kan bli bländad","Bilen drar mer bränsle","Bromsarna blir sämre","Vägen blir halare"],
 e:"Sänk farten, använd solskyddet och håll rutan ren."},
{id:"h42",c:"sakerhet",q:"Varför ska du hålla rutorna rena och isfria?",

 e:"Det är förbjudet att köra med igenfrostade rutor. Skrapa alla rutor, inte bara ett litet titthål."}

const SFX = (()=>{

    if(ctx){ if(ctx.state==="suspended") ctx.resume(); return; }

    try{ ctx = new AC(); }catch(e){ return; }

    init,

    soft(){ tone({f:900,f2:1100,d:.05,type:"sine",g:.05}); },
    select(){ tone({f:660,d:.12,type:"triangle",g:.16}); tone({f:990,d:.1,type:"sine",g:.06,t:.04}); noise({d:.05,g:.05,type:"highpass",f:3000}); },
    correct(streak=1){

    sadtrombone(){ [392,370,349,330].forEach((f,i)=> tone({f,f2:i===3?300:f*.99,t:i*.3,d:i===3?.9:.28,type:"sawtooth",g:.06,lp:900,vib:i===3?6:0})); },
    levelup(){

    badge(){ [1047,1319,1568,2093].forEach((f,i)=> tone({f,t:i*.08,d:.9,type:"sine",g:.11,wet:.65})); },

    heart(){ tone({f:880,d:.25,type:"sine",g:.08,wet:.5}); tone({f:1320,t:.08,d:.35,type:"sine",g:.07,wet:.5}); },
    peek(){ tone({f:300,f2:620,d:.18,type:"sine",g:.09}); tone({f:900,f2:1300,t:.12,d:.08,type:"triangle",g:.05}); },

    fill(p){ tone({f:400+p*900,d:.05,type:"sine",g:.05}); }

})();

/* =====================================================================
   Confetti / particles
   ===================================================================== */
const FX = (()=>{
  const cv=document.getElementById("fx"), cx=cv.getContext("2d"); let P=[], raf=0, dpr=1;
  const COLORS=["#FFC81E","#E1251B","#0A5CAD","#17905A","#FFFFFF","#FF8FB1"];
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
  addEventListener("resize",size); size();
  function burst(x,y,n=40,opts={}){
    if(reduced) n=Math.ceil(n/4);
    const spread=opts.spread||Math.PI*2, dir=opts.dir??-Math.PI/2, speed=opts.speed||9;
    for(let i=0;i<n;i++){
      const ang = spread>=Math.PI*2 ? Math.random()*Math.PI*2 : dir+(Math.random()-.5)*spread;
      const sp = speed*(.45+Math.random()*.75);
      P.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*5,c:rnd(opts.colors||COLORS),life:1,decay:.006+Math.random()*.01,shape:Math.random()<.25?"c":Math.random()<.15?"s":"r",flip:Math.random()*6});
    }
    if(!raf) raf=requestAnimationFrame(step);
  }
  function rain(n=160){
    if(reduced) n=40;
    for(let i=0;i<n;i++) P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:4+Math.random()*5,c:rnd(COLORS),life:1,decay:.0025+Math.random()*.003,shape:Math.random()<.2?"c":Math.random()<.15?"s":"r",flip:Math.random()*6});
    if(!raf) raf=requestAnimationFrame(step);
  }
  function star(c,x,y,r){ c.beginPath(); for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} c.closePath(); c.fill(); }
  function step(){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    P=P.filter(p=>p.life>0 && p.y<innerHeight+40);
    for(const p of P){
      p.vy+=.28; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.flip+=.15; p.life-=p.decay;
      cx.save(); cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.shape==="c"){ cx.beginPath(); cx.arc(0,0,p.w/2.4,0,Math.PI*2); cx.fill(); }
      else if(p.shape==="s"){ star(cx,0,0,p.w*.8); }
      else { cx.scale(1,Math.cos(p.flip)); cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
      cx.restore();
    }
    raf = P.length ? requestAnimationFrame(step) : 0;
    if(!raf) cx.clearRect(0,0,innerWidth,innerHeight);
  }
  return {burst,rain};
})();

  let s=""; const r=44;
  for(let k=0;k<3;k++){
    const a1=(k*120+30)*Math.PI/180, a2=(k*120+105)*Math.PI/180;
    const p1=[100+r*Math.cos(a1),100-r*Math.sin(a1)], p2=[100+r*Math.cos(a2),100-r*Math.sin(a2)];

    const t=[-Math.sin(a2),-Math.cos(a2)], n=[Math.cos(a2),-Math.sin(a2)];

const Coach = (()=>{
  let el=null, typing=null, hideT=null, moodT=null, showT=null;
  const SIDES=["br","bl","r","l","br"];
  function ensure(){
    if(el) return el;
    el=document.createElement("div"); el.className="peek"; el.id="peek"; el.dataset.side="br";
    el.innerHTML=`<div class="peek-bubble" id="bubble" role="status" aria-live="polite"><span class="who">Ian</span><span id="say"></span></div><div class="peek-head" id="coach" aria-label="Ian – tryck för ett tips" role="button"><img src="${IMG_PEEK}" alt=""></div>`;
    document.body.appendChild(el);
    el.querySelector("#coach").addEventListener("click",()=>{ SFX.init(); SFX.horn(); buzz(20); say(rnd(L.tips),{m:"happy"}); });
    el.querySelector("#bubble").addEventListener("click",()=>hide());
    return el;
  }
  function mood(m){
    const h=el&&el.querySelector("#coach"); if(!h) return;
    h.classList.remove("m-happy","m-sad","m-party","m-think","m-talk"); void h.offsetWidth; h.classList.add("m-"+m);
    clearTimeout(moodT); moodT=setTimeout(()=>h.classList.remove("m-"+m), m==="think"?1700:1200);
  }
  function type(text,sound){
    const t=$("#say",el); clearInterval(typing);
    if(reduced){ t.textContent=text; return; }
    let i=0; t.textContent="";
    const caret=document.createElement("span"); caret.className="caret"; caret.textContent="▍";
    typing=setInterval(()=>{
      i++; t.textContent=text.slice(0,i); t.appendChild(caret);
      if(sound && i%3===1 && text[i-1]!==" ") SFX.blip();
      if(i>=text.length){ clearInterval(typing); caret.remove(); }
    },22);
  }
  function say(text,{m=null,side=null,sound=true,hold=null}={}){
    ensure(); text=fill(text);
    clearTimeout(hideT); clearTimeout(showT);
    const wasOn=el.classList.contains("on");
    const go=()=>{
      if(!el.classList.contains("on")){
        el.dataset.side = side || SIDES[Math.floor(Math.random()*SIDES.length)];
        void el.offsetWidth; el.classList.add("on"); SFX.peek();
      }
      setTimeout(()=>{ mood(m||"talk"); type(text,sound); }, wasOn?0:320);
      hideT=setTimeout(hide, hold || Math.max(2800, text.length*55+1800));
    };
    if(wasOn && side && side!==el.dataset.side){ el.classList.remove("on"); showT=setTimeout(()=>{ go(); },380); }
    else go();
  }
  function hide(){ if(!el) return; clearTimeout(hideT); clearInterval(typing); el.classList.remove("on"); }
  function hearts(n=5){
    ensure();
    setTimeout(()=>{
      const h=el.querySelector("#coach").getBoundingClientRect();
      const x=Math.min(innerWidth-30,Math.max(30,h.left+h.width/2)), y=Math.min(innerHeight-40,Math.max(40,h.top+h.height*.3));
      for(let k=0;k<n;k++) setTimeout(()=>{
        const e=document.createElement("div"); e.className="heart"; e.innerHTML=ICON.spark;
        e.style.left=(x+Math.random()*40-20)+"px"; e.style.top=y+"px"; e.style.setProperty("--dx",(Math.random()*70-35)+"px");
        document.body.appendChild(e); setTimeout(()=>e.remove(),1800);
        if(k%2===0) SFX.heart();
      },k*140);
    },650);
  }
  return {say,hide,mood,hearts,wire(){}};
})();

  b.onclick=()=>{ SFX.init(); S.sound=!S.sound; save(); b.innerHTML=S.sound?ICON.sound:ICON.mute; b.setAttribute("aria-label",S.sound?"Stäng av ljud":"Slå på ljud"); if(S.sound) SFX.tap(); };
}
function clickSounds(root=app){
  root.querySelectorAll("[data-sfx]").forEach(el=>{
    el.addEventListener("pointerdown",()=>{ SFX.init(); SFX.tap(); buzz(8); });
  });
}

function isYesterday(d){ if(!d) return false; const y=new Date(); y.setDate(y.getDate()-1); return d===(y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate()); }

function enter(){ if(reduced) return; const kids=[...app.children]; kids.forEach((k,i)=>k.animate([{opacity:0,transform:"translateY(12px)"},{opacity:1,transform:"none"}],{duration:380,delay:i*50,easing:"cubic-bezier(.2,.9,.3,1)",fill:"backwards"})); }

/* ---------- Journey map ---------- */
const MAP_D = "M 46 178 C 120 178 130 70 210 70 S 300 180 380 180 S 470 70 550 70 S 640 180 720 180 S 820 110 860 74";
const mapFrac = xp => { const lp=levelProgress(xp); const f = lp.max ? 1 : (lp.i + lp.pct)/(LEVELS.length-1); return .02 + Math.min(1,f)*.96; };
let mapRaf=0;
function drawMap(){
  const path=$("#mroad"), st=$("#mstations"), car=$("#mcar"), sc=$("#mapScroll"); if(!path||!st||!car) return;
  const L=path.getTotalLength(), n=LEVELS.length, cur=levelFor(S.xp);
  const at = f => path.getPointAtLength(Math.max(0,Math.min(1,f))*L);
  let html="";
  for(let i=0;i<n;i++){
    const f=.02+i/(n-1)*.96, p=at(f), done=i<cur, now=i===cur, above=i%2===0;
    const ly = p.y<125 ? p.y-28 : p.y+40, showL = now || i===n-1;
    html+=`<g class="stn ${done?"done":now?"now":"todo"}">${now?`<circle cx="${p.x}" cy="${p.y}" r="22" class="pulse"/>`:""}<circle cx="${p.x}" cy="${p.y}" r="16" class="dotc"/><text x="${p.x}" y="${p.y+6}" text-anchor="middle" class="stn-n">${i===n-1?"★":i+1}</text>${showL?`<text x="${p.x}" y="${ly}" text-anchor="${i===n-1?"end":"middle"}" dx="${i===n-1?18:0}" class="stn-l ${now?"cur":""}">${i===n-1&&!now?"Körkort!":LEVELS[i].name}</text>`:""}</g>`;
  }
  st.innerHTML=html;
  const place = f => { const p=at(f), q=at(f+.004), a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI; car.setAttribute("transform",`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(a+90).toFixed(1)}) scale(.95)`); return p; };
  const scrollTo = p => { if(!sc) return; const k=sc.clientWidth/ (sc.scrollWidth||1) ; const svg=$("#map"); const scale=svg.getBoundingClientRect().width/900; const x=p.x*scale - sc.clientWidth/2; sc.scrollLeft=Math.max(0,x); };
  const to=mapFrac(S.xp), from=Math.min(S.mapF||.02,to);
  cancelAnimationFrame(mapRaf);
  if(to-from<.002 || reduced){ scrollTo(place(to)); S.mapF=to; save(); return; }
  scrollTo(place(from));
  const stF=[...Array(n)].map((_,i)=>.02+i/(n-1)*.96);
  const dur=Math.min(2600,900+(to-from)*6000), t0=performance.now()+500; let last=from;
  setTimeout(()=>SFX.vroom(),0);
  (function step(t){
    const k=Math.max(0,Math.min(1,(t-t0)/dur)), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, f=from+(to-from)*e;
    const p=place(f); if(sc && sc.scrollWidth>sc.clientWidth) scrollTo(p);
    stF.forEach((sf,i)=>{ if(last<sf && f>=sf && i>0){ SFX.star(Math.min(2,i%3)); const r=$("#map").getBoundingClientRect(), sc2=r.width/900; FX.burst(r.left+at(sf).x*sc2, r.top+at(sf).y*sc2, 30, {speed:7}); } });
    last=f;
    if(k<1) mapRaf=requestAnimationFrame(step); else { S.mapF=to; save(); }
  })(performance.now());
}

function dailyQ(){ const d=today(); let h=7; for(const ch of d) h=(h*31+ch.charCodeAt(0))>>>0; return QUESTIONS[h%QUESTIONS.length]; }
function dqStreakNow(){ return (S.dq.d===today()||isYesterday(S.dq.d)) ? S.dqStreak : 0; }
function dailyCardHTML(){
  const q=dailyQ(), done=S.dq.d===today(), st=dqStreakNow();
  return `<div class="daily ${done?"done":""}">
    <div class="daily-ic">${done?(S.dq.ok?ICON.check:ICON.cross):sign(CATS[q.c].sign)}</div>
    <div class="daily-tx"><span class="eyebrow-s">Dagens fråga${st?` · <span class="num">${st}</span> ${st===1?"dag":"dagar"} i rad`:""}</span><b>${done?(S.dq.ok?"Rätt! En ny fråga kommer i morgon.":"Nästan. En ny fråga kommer i morgon."):esc(q.q)}</b></div>
    ${done?"":`<button class="btn sm" id="dqgo" data-sfx>Svara</button>`}

}

    else { b.classList.add("wrong"); b.querySelector(".mark").innerHTML=ICON.cross; SFX.wrong(); buzz([30,40,30]); const c=btns[order.indexOf(0)]; setTimeout(()=>{ c.classList.add("correct"); c.querySelector(".mark").innerHTML=ICON.check; },350); }
    floatText(b,"+"+gain+" XP",!ok);
    $("#dqfb",ov).innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><h3>${ok?"Rätt svar!":"Inte riktigt."}</h3><p>${ok?"":`<b>Rätt svar:</b> ${esc(q.a[0])}<br>`}${esc(q.e)}</p><button class="btn block" id="dqok" data-sfx>Klar</button></div>`;
    clickSounds(ov); $("#dqok",ov).onclick=close; setTimeout(()=>$("#dqok",ov).focus({preventScroll:true}),300);
    Coach.say(ok?(S.dqStreak>1?`Dagens fråga klar, ${S.dqStreak} dagar i rad.`:"Dagens fråga klar. Snyggt."):"Nu vet du den till provet.",{m:ok?"happy":"sad",side:"bl"});

/* ---------- Round setup ---------- */
function pick(pool,n){
  // Unseen and recently missed questions first; questions that "sit" (box 2+) come back less often.
  const key = q => (S.seen[q.id] ? (S.box[q.id]||0)*1.3 + .5 : 0) + Math.random()*1.4;
  return pool.map(q=>({q,k:key(q)})).sort((a,b)=>a.k-b.k).slice(0,n).map(o=>o.q);
}
const sitter = () => QUESTIONS.filter(q=>(S.box[q.id]||0)>=2).length;
function mkItem(q){ return {q, order: shuffle(q.a.map((_,i)=>i))}; }
function startRound(mode,cat=null){
  SFX.init(); clearInterval(homeIdle); Coach.hide();
  let qs;
  if(mode==="quick") qs=pick(QUESTIONS,10);
  else if(mode==="cat") qs=pick(QUESTIONS.filter(q=>q.c===cat),12);
  else if(mode==="prov") qs=pick(QUESTIONS,40);
  else if(mode==="review") qs=shuffle(QUESTIONS.filter(q=>S.wrong.includes(q.id))).slice(0,10);
  else if(mode==="blixt") qs=shuffle(QUESTIONS.slice());
  if(!qs||!qs.length) return renderHome();
  R = {mode,cat,items:qs.map(mkItem),i:0,score:0,streak:0,best:0,correct:0,answered:0,log:[],fifty:mode==="prov"||mode==="blixt"?0:1,locked:false,
       time: mode==="blixt"?60 : mode==="prov"?1800 : 0, startXP:S.xp, startLevel:levelFor(S.xp), newBadges:[]};
  if(cat && !S.catsPlayed.includes(cat)) S.catsPlayed.push(cat);
  if(mode!=="cat") Object.keys(CATS).forEach(k=>{ if(qs.some(q=>q.c===k) && !S.catsPlayed.includes(k) && mode!=="blixt") S.catsPlayed.push(k); });
  SFX.blinker(); SFX.vroom();
  renderQuiz();
  const lines = mode==="prov"?L.startProv : mode==="blixt"?L.startBlixt : L.start;
  Coach.say(rnd(lines),{m:"happy"});
  if(R.time) startTimer();
}
const GOAL = 20;
function dailyToast(){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`${badgeSvg(String(GOAL),true)}<div><small>Dagens mål</small><b>${GOAL} frågor klara</b></div>`;
  document.body.appendChild(t); SFX.badge(); setTimeout(()=>t.remove(),3300);
}
function greetWord(){ const d=new Date(); const w=["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"][d.getDay()]; const m=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"][d.getMonth()]; return `${w} ${d.getDate()} ${m}`; }
function ring(pct,size=84,stroke=9,color="var(--ok)"){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="${stroke}"/><circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${(c*(1-Math.min(1,pct))).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
const multFor = s => s>=10?4 : s>=6?3 : s>=3?2 : 1;

/* ---------- Quiz ---------- */
function renderQuiz(){
  const total = R.mode==="blixt" ? null : R.items.length;
  const timerPill = R.time ? `<div class="pill timer" id="tp">${ICON.clock}<span class="num" id="tv">${fmtTime(R.time)}</span></div>` : "";
  const scorePill = R.mode==="prov" ? "" : `<div class="pill" id="sp">${ICON.star}<span class="num" id="sv">${R.score}</span></div>`;
  const streakPill = R.mode==="prov" ? "" : `<div class="pill streak" id="stp">${ICON.flame}<span class="num" id="stv">${R.streak}</span><span class="mult" id="mv">x${multFor(R.streak)}</span></div>`;
  const roadHTML = total ? `<div class="road" id="road" aria-label="Framsteg"><div class="dots" id="dots"></div><div class="car" id="car">${ICON.car}</div><div class="flag">${ICON.flag}</div></div>` : `<div style="flex:1"></div>`;
  app.innerHTML = `
  <div class="hud"><button class="icon-btn" id="quit" aria-label="Avsluta rundan" data-sfx>${ICON.close}</button>${roadHTML}${timerPill}${scorePill}${streakPill}<button class="icon-btn" id="snd" aria-label="Ljud">${S.sound?ICON.sound:ICON.mute}</button></div>
  ${R.mode==="blixt"?`<div class="timebar" id="tb"><i id="tbi" style="width:100%"></i></div>`:""}
  <section class="quiz"><div class="card" id="qcard"></div></section>`;
  enter();
  wireSound(); clickSounds(); Coach.wire();
  $("#quit").onclick=()=>confirmSheet("Avsluta rundan?","Dina poäng från rundan sparas inte om du avslutar nu.",[
    {label:"Fortsätt öva",cls:"ghost",fn:()=>{}},
    {label:"Avsluta",fn:()=>{ if(R) clearTimeout(R.idleT); stopTimer(); R=null; Coach.hide(); SFX.whoosh(); renderHome(false); }}
  ]);
  renderQuestion(true);
}

function updateRoad(){
  const car=$("#car"), dots=$("#dots"); if(!car||!dots) return;
  let pct;
  if(R.mode==="blixt") pct = Math.min(1,R.streak/10);
  else pct = R.answered / R.items.length;
  car.style.left = `calc(16px + (100% - 46px) * ${pct})`;
  car.classList.remove("vroom"); void car.offsetWidth; car.classList.add("vroom");
}
function addDot(kind){
  const dots=$("#dots"); if(!dots||R.mode==="blixt") return;
  const d=document.createElement("div"); d.className="dot "+kind; d.dataset.n=R.answered; d.style.left=((R.answered-.5)/R.items.length*100)+"%"; dots.appendChild(d);
}
function relayoutDots(){ document.querySelectorAll("#dots .dot").forEach(d=>d.style.left=((+d.dataset.n-.5)/R.items.length*100)+"%"); }
function renderQuestion(first=false){
  const it=R.items[R.i], q=it.q, cat=CATS[q.c];
  const total=R.mode==="blixt"?"":` av ${R.items.length}`;
  const keys=["A","B","C","D"];
  $("#qcard").innerHTML = `
    <div class="q-meta"><span class="chips"><span class="chip" style="--c:${cat.color}"><i></i>${cat.short}</span>${it.retry?`<span class="chip retry">Repris</span>`:""}</span><span class="q-count num">Fråga ${R.i+1}${total}</span></div>
    <h2 class="q-text" id="qt">${esc(q.q)}</h2>
    ${figure(q.img)}
    <div class="answers" role="group" aria-labelledby="qt">${it.order.map((ai,k)=>`<button class="ans" data-k="${k}"><span class="key">${keys[k]}</span><span>${esc(q.a[ai])}</span><span class="mark"></span></button>`).join("")}</div>
    <div class="tools">${R.fifty!==0||R.mode==="quick"||R.mode==="cat"||R.mode==="review" ? `<button class="tool" id="fifty" ${R.fifty>0?"":"disabled"}>${ICON.help}Fråga Ian <span class="num">(${R.fifty})</span></button>`:"<span></span>"}<span class="kbd-hint">Tangenter: 1–4 för svar, Enter för nästa</span></div>
    <div id="fb"></div>`;
  const card=$("#qcard");
  if(!first){ card.animate([{opacity:0,transform:"translateX(28px)"},{opacity:1,transform:"none"}],{duration:reduced?1:320,easing:"cubic-bezier(.2,.9,.3,1)"}); }
  card.querySelectorAll(".ans").forEach(b=>{
    b.addEventListener("pointerdown",()=>{ SFX.init(); });
    b.addEventListener("click",()=>answer(+b.dataset.k));
  });
  const f=$("#fifty"); if(f) f.onclick=useFifty;
  R.locked=false; R.qStart=performance.now();
  clearTimeout(R.idleT);
  if(R.mode!=="blixt" && R.mode!=="prov") R.idleT=setTimeout(()=>{ if(R && !R.locked) Coach.say(rnd(L.idleQ),{m:"think"}); },35000);
  updateRoad();
}
function useFifty(){
  if(!R||R.fifty<=0||R.locked) return;
  R.fifty--; const it=R.items[R.i];
  const wrongKs = it.order.map((ai,k)=>({ai,k})).filter(o=>o.ai!==0).map(o=>o.k);
  shuffle(wrongKs).slice(0,2).forEach((k,i)=>setTimeout(()=>{ const b=$(`.ans[data-k="${k}"]`); if(b){ b.classList.add("gone"); b.disabled=true; SFX.poof(); } },300+i*260));
  const f=$("#fifty"); if(f){ f.disabled=true; f.querySelector(".num").textContent="(0)"; }
  Coach.say(rnd(L.fifty),{m:"think"});
}
function floatText(el,text,neg=false){
  const r=el.getBoundingClientRect(); const d=document.createElement("div");
  d.className="float-pts"+(neg?" neg":""); d.textContent=text;
  d.style.left=(r.left+r.width*.75)+"px"; d.style.top=(r.top-6)+"px";
  document.body.appendChild(d); setTimeout(()=>d.remove(),1150);
}
function bump(id){ const e=$(id); if(!e) return; e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); }
function countTo(el,from,to,dur=500){
  if(!el) return; const t0=performance.now(); let lastTick=0;
  (function f(t){ const p=Math.min(1,(t-t0)/dur), v=Math.round(from+(to-from)*(1-Math.pow(1-p,3))); el.textContent=v; if(t-lastTick>70&&p<1){ SFX.tick(); lastTick=t; } if(p<1) requestAnimationFrame(f); })(t0);
}
function comboBanner(mult){
  const d=document.createElement("div"); d.className="combo"; d.innerHTML=`<b>x${mult}</b><span>${mult===2?"Combo":mult===3?"Superkombo":"Megakombo"}</span>`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1500);
}
function recordStats(q,ok){
  S.seen[q.id]=(S.seen[q.id]||0)+1;
  S.box[q.id] = ok ? Math.min(5,(S.box[q.id]||0)+1) : 0;
  if(!S.daily||S.daily.d!==today()) S.daily={d:today(),n:0};
  S.daily.n++;
  if(S.daily.n===GOAL) setTimeout(()=>dailyToast(),900);
  const c=S.cat[q.c]||(S.cat[q.c]={r:0,t:0}); c.t++; if(ok) c.r++;
  if(ok){ if(q.c==="skyltar") S.signsRight++; const wi=S.wrong.indexOf(q.id); if(wi>=0){ S.wrong.splice(wi,1); if(R&&R.mode==="review") S.reviewFixed++; } }
  else if(!S.wrong.includes(q.id)) S.wrong.push(q.id);
  save();
}
function answer(k){
  if(!R||R.locked) return;
  const it=R.items[R.i], q=it.q, btns=[...document.querySelectorAll(".ans")], btn=btns[k];
  if(!btn||btn.disabled) return;
  R.locked=true; clearTimeout(R.idleT); const ok = it.order[k]===0; R.answered++;
  recordStats(q,ok);
  R.log.push({q,picked:it.order[k],ok});
  btns.forEach(b=>b.disabled=true);
  { const f=$("#fifty"); if(f) f.disabled=true; }

  if(R.mode==="prov"){
    btn.classList.add("picked"); SFX.select(); buzz(10);
    if(ok) R.correct++;
    addDot("neutral");
    const n=R.answered;
    if(n%8===0 && n<R.items.length) Coach.say(rnd(L.provMid),{m:"talk",sound:false});
    setTimeout(()=>next(),420);
    return;
  }

  const r=btn.getBoundingClientRect();
  const corrK = it.order.indexOf(0), corrBtn=btns[corrK];
  if(ok){
    R.streak++; R.best=Math.max(R.best,R.streak); R.correct++;
    const mult=multFor(R.streak), base=R.mode==="blixt"?50:100, pts=base*mult;
    const old=R.score; R.score+=pts;
    btn.classList.add("correct"); btn.querySelector(".mark").innerHTML=ICON.check;
    SFX.correct(R.streak); buzz(18);
    FX.burst(r.left+r.width*.5,r.top+r.height*.5, 26+Math.min(R.streak,10)*4, {speed:8+Math.min(R.streak,10)*.5});
    floatText(btn,"+"+pts+(mult>1?`  x${mult}`:""));
    setTimeout(()=>SFX.pts(),180);
    countTo($("#sv"),old,R.score,520); bump("#sp");
    const stv=$("#stv"); if(stv) stv.textContent=R.streak;
    const stp=$("#stp"); if(stp){ stp.classList.toggle("hot",mult>1); $("#mv").textContent="x"+mult; bump("#stp"); }
    addDot("ok");
    if(L.combo[R.streak]){ setTimeout(()=>{ comboBanner(mult); SFX.combo(mult-1); FX.burst(innerWidth/2,innerHeight*.38,90,{speed:14}); },260); if(R.streak>=6) Coach.say(rnd(L.mine)+" "+L.combo[R.streak],{m:"party"}); }
    else if(R.streak===5){ Coach.say(rnd(L.mine),{m:"party"}); Coach.hearts(7); }
    else if(R.mode!=="blixt" && Math.random()<.3) Coach.say(rnd(Math.random()<.8?L.mine:L.correct),{m:"happy"});
    if(R.streak===10) Coach.hearts(8);
    if(R.streak===5) unlock("s5"); if(R.streak===10) unlock("s10");
    if(R.mode==="blixt"){ R.time=Math.min(R.time+2,99); updateTimer(); floatTextTimer("+2 s"); }
  } else {
    const broke=R.streak>=3; R.streak=0;
    btn.classList.add("wrong"); btn.querySelector(".mark").innerHTML=ICON.cross;
    setTimeout(()=>{ corrBtn.classList.add("correct"); corrBtn.querySelector(".mark").innerHTML=ICON.check; },R.mode==="blixt"?120:380);
    btns.forEach((b,i)=>{ if(i!==k&&i!==corrK) b.classList.add("dim"); });
    SFX.wrong(); buzz([30,40,30]);
    const stv=$("#stv"); if(stv) stv.textContent=0; const stp=$("#stp"); if(stp) stp.classList.remove("hot");
    addDot("bad");
    if(["quick","cat","review"].includes(R.mode) && !it.retry){
      R.items.splice(Math.min(R.i+3,R.items.length),0,{q,order:shuffle(q.a.map((_,i)=>i)),retry:true});
      relayoutDots();
    }
    if(R.mode!=="blixt" && (broke || Math.random()<.2)) Coach.say(broke?rnd(L.broke):rnd(L.wrong),{m:"sad"});
    if(R.mode==="blixt"){ R.time=Math.max(0,R.time-3); updateTimer(); floatTextTimer("−3 s",true); }
  }
  updateRoad();
  if(R.mode==="blixt"){ setTimeout(()=>next(), ok?420:950); return; }

  const fb=$("#fb");
  const right = q.a[0];
  fb.innerHTML = `<div class="feedback ${ok?"ok":"bad"}"><h3>${ok?"Rätt svar!":"Inte riktigt."}</h3><p>${ok?"":`<b>Rätt svar:</b> ${esc(right)}<br>`}${esc(q.e)}</p><button class="btn block" id="nx" data-sfx>${R.i+1<R.items.length?"Nästa fråga":"Se resultatet"} →</button></div>`;
  clickSounds(fb);
  $("#nx").onclick=()=>next();
  setTimeout(()=>{ const nx=$("#nx"); if(nx){ nx.focus({preventScroll:true}); nx.scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"}); } },ok?250:500);
}
function floatTextTimer(t,neg){ const tp=$("#tp"); if(tp) floatText(tp,t,neg); }
function next(){
  if(!R) return;
  R.i++;
  if(R.mode==="blixt"){
    if(R.time<=0) return finish();
    if(R.i>=R.items.length){ R.items=R.items.concat(shuffle(QUESTIONS.slice()).map(mkItem)); }
  } else if(R.i>=R.items.length) return finish();
  SFX.whoosh();
  renderQuestion();
  $("#qcard").scrollIntoView({behavior:reduced?"auto":"smooth",block:"nearest"});
}

/* ---------- Timer ---------- */
function fmtTime(s){ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function startTimer(){
  stopTimer(); let last=performance.now();
  timerId=setInterval(()=>{
    if(!R) return stopTimer();
    const now=performance.now(); const dt=(now-last)/1000; last=now;
    if(document.hidden) return;
    const before=Math.ceil(R.time); R.time-=dt; const after=Math.ceil(R.time);
    if(after!==before){
      updateTimer();
      if(R.mode==="blixt" && after<=10 && after>0) SFX.clock(after<=5);
      if(R.mode==="prov" && after<=60 && after>0 && after%10===0) SFX.clock(true);
    }
    if(R.time<=0){ R.time=0; updateTimer(); stopTimer(); if(R.mode==="blixt"){ R.locked=true; SFX.horn(); Coach.say("Tiden är ute!",{m:"party"}); setTimeout(finish,900); } else { finish(); } }
  },100);
}
function stopTimer(){ clearInterval(timerId); timerId=null; }
function updateTimer(){
  const tv=$("#tv"), tp=$("#tp"); if(tv) tv.textContent=fmtTime(R.time);
  const low = R.mode==="blixt"? R.time<=10 : R.time<=120;
  if(tp) tp.classList.toggle("low",low);
  const tbi=$("#tbi"), tb=$("#tb"); if(tbi){ tbi.style.width=Math.min(100,R.time/60*100)+"%"; tb.classList.toggle("low",low); }
}

/* ---------- Badges & XP ---------- */
function unlock(id){
  if(S.badges.includes(id)) return;
  S.badges.push(id); save();
  if(R) R.newBadges.push(id);
  const b=BADGES.find(x=>x.id===id);
  setTimeout(()=>{
    const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
    t.innerHTML=`${badgeSvg(b.label,true)}<div><small>Ny medalj</small><b>${b.name}</b></div>`;
    document.body.appendChild(t); SFX.badge(); setTimeout(()=>t.remove(),3300);
  },700);
}
function updateDay(){
  const t=today();
  if(S.day.last===t) return;
  S.day.streak = isYesterday(S.day.last) ? S.day.streak+1 : 1;
  S.day.last = t; save();
}

/* ---------- Results ---------- */
function finish(){
  stopTimer();
  const r=R; if(!r) return; clearTimeout(r.idleT);
  const n = r.mode==="blixt" ? r.answered : r.items.length;
  const pct = n ? r.correct/n : 0;
  let stars, pass=null, title, sub;
  if(r.mode==="prov"){
    pass = r.correct >= Math.ceil(n*.8);
    stars = pct>=.95?3 : pass?2 : pct>=.6?1 : 0;
    title = pass ? "Godkänt!" : "Inte godkänt än";
    sub = pass ? `Du fick ${r.correct} av ${n} rätt. Det räcker på riktiga provet också.` : `Du fick ${r.correct} av ${n}. Gränsen är ${Math.ceil(n*.8)}. Repetera missarna och kör igen!`;
    r.score = r.correct*100;
  } else if(r.mode==="blixt"){
    stars = r.correct>=15?3 : r.correct>=10?2 : r.correct>=5?1 : 0;
    title = r.correct>=15?"Blixtsnabb!" : r.correct>=8?"Snyggt kört!" : "Bra försök!";
    sub = `${r.correct} rätt på 60 sekunder. Bästa svit: ${r.best}.`;
  } else {
    stars = pct>=.9?3 : pct>=.7?2 : pct>=.5?1 : 0;
    title = pct===1?"Felfritt!" : pct>=.8?"Snyggt kört!" : pct>=.5?"Bra jobbat!" : "Övning ger färdighet";
    sub = `Du fick ${r.correct} av ${n} rätt.`;
  }
  const xpGain = Math.round(r.score/10) + (n?20:0) + (pass?200:0);
  const oldXP = S.xp; S.xp += xpGain;
  const bestKey = r.mode+(r.cat?":"+r.cat:""); const prevBest=S.best[bestKey]||0; const newBest = r.score>prevBest; if(newBest) S.best[bestKey]=r.score;
  updateDay(); save();
  // badges
  unlock("first");
  if(r.mode!=="blixt" && n>=8 && r.correct===n) unlock("perfect");
  if(pass) unlock("prov");
  if(r.mode==="blixt" && r.correct>=15) unlock("blixt");
  if(S.signsRight>=20) unlock("signs");
  if(Object.keys(CATS).every(k=>S.catsPlayed.includes(k))) unlock("allcats");
  if(S.reviewFixed>=10) unlock("review");
  if(S.day.streak>=3) unlock("days3");
  const h=new Date().getHours(); if(h>=22||h<4) unlock("night");
  if(levelFor(S.xp)>=4) unlock("lvl5");

  const wrongs = r.log.filter(l=>!l.ok);
  app.innerHTML = `${topbar()}
  <section class="results">
    <div class="card">
      <div class="res-head">
        ${pass!==null?`<span class="verdict ${pass?"pass":"fail"}">${pass?"Godkänd":"Underkänd"}</span>`:""}
        <div class="stars" id="stars">${[0,1,2].map(()=>starSvg).join("")}</div>
        <h1>${title}</h1><p>${esc(sub)}</p>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="r-c">0</div><small>Rätt</small></div>
        <div class="stat"><div class="num" id="r-s">0</div><small>Poäng${newBest&&r.score?" · rekord":""}</small></div>
        <div class="stat"><div class="num">${r.best}</div><small>Bästa svit</small></div>
        <div class="stat"><div class="num">${n?Math.round(pct*100):0}%</div><small>Träffsäkerhet</small></div>
      </div>
      <div class="res-xp"><div class="row"><span>Nivå ${levelFor(oldXP)+1} · ${LEVELS[levelFor(oldXP)].name}</span><span class="num" id="r-xp">+0 XP</span></div><div class="xpbar"><i id="rxb" style="width:${levelProgress(oldXP).pct*100}%"></i></div></div>
      <div class="res-actions"><button class="btn" id="again" data-sfx>Kör igen</button><button class="btn ghost" id="home" data-sfx>Till start</button></div>
      ${wrongs.length?`<div class="review"><h2>Det här kan du repetera</h2>${wrongs.map(w=>`<div class="rv"><div class="q">${esc(w.q.q)}</div><div class="you">Ditt svar: ${esc(w.q.a[w.picked])}</div><div class="right">Rätt svar: ${esc(w.q.a[0])}</div><div class="why">${esc(w.q.e)}</div></div>`).join("")}</div>`:""}
    </div>
  </section>`;
  wireSound(); clickSounds(); enter();
  $("#again").onclick=()=>startRound(r.mode,r.cat);
  $("#home").onclick=()=>{ SFX.whoosh(); renderHome(); };
  R=null;

  // the show
  const good = pass===true || (pass===null && stars>=2);
  const line = pass===true ? `Godkänt! Du är bäst, ${nm()}.` : pass===false ? "Inte godkänt än. Repetera missarna och kör igen." :
     stars===3 ? "Tre stjärnor. Snyggt!" : stars===2 ? "Bra jobbat! Snart redo för provet." : stars===1 ? "Bra kämpat. Kolla missarna nedanför." : "Tuff runda. Kolla missarna nedanför så sitter de nästa gång.";
  setTimeout(()=>Coach.say(line,{m:good?"party":"talk",side:"br",hold:6500}),2600);
  if(good){ setTimeout(()=>{ SFX.fanfare(); FX.rain(170); },350); setTimeout(()=>Coach.hearts(8),2700); }
  else if(pass===false) setTimeout(()=>SFX.sadtrombone(),400);
  const sv=document.querySelectorAll("#stars svg");
  sv.forEach((s,i)=>setTimeout(()=>{
    if(i<stars){ s.classList.add("on"); SFX.star(i); buzz(15); const b=s.getBoundingClientRect(); FX.burst(b.left+b.width/2,b.top+b.height/2,24,{speed:7,colors:["#FFC81E","#FFE48A","#FFFFFF"]}); }
    else s.classList.add("off");
  },900+i*420));
  const t2=900+3*420;
  setTimeout(()=>{ countTo($("#r-c"),0,r.correct,600); countTo($("#r-s"),0,r.score,900); },t2);
  setTimeout(()=>animateXP(oldXP,S.xp),t2+1000);
}
function animateXP(from,to){
  const el=$("#r-xp"), bar=$("#rxb"); if(!el||!bar) return;
  const dur=1400, t0=performance.now(); let lastLvl=levelFor(from), lastS=0;
  bar.style.transition="none";
  (function f(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3), xp=Math.round(from+(to-from)*e);
    el.textContent="+"+(xp-from)+" XP";
    const lp=levelProgress(xp); bar.style.width=(lp.pct*100)+"%";
    if(t-lastS>60 && p<1){ SFX.fill(lp.pct); lastS=t; }
    if(lp.i>lastLvl){ lastLvl=lp.i; const row=el.parentElement.firstElementChild; row.textContent=`Nivå ${lp.i+1} · ${LEVELS[lp.i].name}`; levelUp(lp.i); }
    if(p<1) requestAnimationFrame(f);
  })(t0);
}
function levelUp(i){
  SFX.levelup(); buzz([20,30,20,30,60]); FX.rain(200);
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="sheet lvlup" role="dialog" aria-modal="true"><small>Ny nivå</small>${levelSign(i)}<h2>${LEVELS[i].name}</h2><p>Du har nått nivå ${i+1}. ${i+1<LEVELS.length?"Fortsätt så, körkortet närmar sig!":"Du är redo. Boka provet!"}</p><div class="row"><button class="btn" id="lvok" data-sfx>Yes!</button></div></div>`;
  document.body.appendChild(ov); clickSounds(ov);
  const close=()=>ov.remove(); $("#lvok",ov).onclick=close; ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  setTimeout(()=>{ const b=$("#lvok",ov); b&&b.focus(); },50);
}

/* ---------- Keyboard ---------- */
addEventListener("keydown",e=>{
  if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
  if(document.querySelector(".overlay")) { if(e.key==="Escape") document.querySelector(".overlay").remove(); return; }
  if(!R) return;
  const map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  const k=map[e.key.toLowerCase()];
  if(k!==undefined && !R.locked){ e.preventDefault(); SFX.init(); answer(k); return; }
  if((e.key==="Enter"||e.key===" ") && R.locked && R.mode!=="prov" && R.mode!=="blixt"){ const nx=$("#nx"); if(nx && document.activeElement!==nx){ e.preventDefault(); nx.click(); } }
});

/* ---------- Boot ---------- */
/* Keep a running round alive when a new version of the page is delivered. */
function snap(){
  try{ save(); }catch(e){}
  if(!R) return {};
  return {round:{mode:R.mode,cat:R.cat,i:R.i,score:R.score,streak:R.streak,best:R.best,correct:R.correct,answered:R.answered,fifty:R.fifty,time:R.time,startXP:R.startXP,startLevel:R.startLevel,locked:R.locked,
    items:R.items.map(it=>({id:it.q.id,order:it.order,retry:!!it.retry})),log:R.log.map(l=>({id:l.q.id,picked:l.picked,ok:l.ok}))}};
}
function restoreRound(d){
  const byId=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
  const items=d.items.filter(x=>byId[x.id]).map(x=>({q:byId[x.id],order:x.order,retry:x.retry}));
  if(!items.length) return false;
  R=Object.assign({},d,{items,log:d.log.filter(l=>byId[l.id]).map(l=>({q:byId[l.id],picked:l.picked,ok:l.ok})),newBadges:[],locked:false});
  if(d.locked) R.i++;
  if(R.mode!=="blixt" && R.i>=R.items.length){ finish(); return true; }
  if(R.mode==="blixt" && R.i>=R.items.length) R.items=R.items.concat(shuffle(QUESTIONS.slice()).map(mkItem));
  renderQuiz();
  const dots=$("#dots"); if(dots && R.mode!=="blixt") R.log.forEach((l,k)=>{ const e=document.createElement("div"); e.className="dot "+(R.mode==="prov"?"neutral":l.ok?"ok":"bad"); e.dataset.n=k+1; e.style.left=((k+.5)/R.items.length*100)+"%"; dots.appendChild(e); });
  if(R.time) startTimer();
  return true;
}
function boot(data){
  try{ window.claude?.hot?.snapshot?.(snap); }catch(e){}
  if(data && data.round){ try{ if(restoreRound(data.round)) return; }catch(e){ R=null; } }
  let seen=false; try{ seen=sessionStorage.getItem("kr-intro")==="1"; }catch(e){}
  if(data && Object.keys(data).length===0) seen=true;
  renderHome(seen);
  if(!seen) showIntro();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
