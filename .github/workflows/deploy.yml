name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Unit tests (phase boundaries, lever rule, cooling, microstructure)
        run: npm test
      - name: Production build
        run: npm run build

      # Only the default branch is published; every other push is just verified.
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run instead of requiring a
          # manual visit to Settings -> Pages.
          enablement: true

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    # Never let two Pages deployments race each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
